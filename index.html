                { date: '2026-07-07', title: '교권침해 상담 5년새 4배로 늘어, 작년 5만7966건', summary: '교권 침해 관련 상담 건수가 5년 새 4배로 늘어 작년에만 5만7966건에 달한 것으로 나타났다. 교권 침해가 해마다 급증하면서 체계적인 교사 보호 시스템 마련이 시급한 과제로 부각됐다.', source: '동아일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/020/0003731933?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/07/07/0003731933_001_20260707043114031.jpg?type=w800' },
                { date: '2026-07-08', title: '"스마트폰 내려놓은 자리에 책과 예술을"…안민석, 경기도의회에 \'벽 깨기 동맹\' 제안', summary: '안민석 경기도교육감이 경기도의회에 스마트폰 없는 교실 정책을 지원하는 벽 깨기 동맹을 제안했다. 스마트폰 내려놓은 자리를 독서와 예술 활동으로 채우는 대안 문화 조성을 목표로 한다.', source: '이투데이', importance: 'positive', url: 'https://www.etoday.co.kr/news/view/2601268', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260707184615_2356314_1199_772.jpg' },
                { date: '2026-07-08', title: '"AI 전략 갖춘 학교는 2%"… 중요성 커지는 교사 AI 교육 시장', summary: '전국 학교 중 AI 전략을 갖춘 곳이 2%에 불과하다는 조사 결과가 나왔다. AI 교육에 대한 학교 현장의 준비 부족이 확인되면서 교사 대상 AI 교육 시장의 중요성이 커지고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165239', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165239_446957_459_v150.jpg' },
                { date: '2026-07-08', title: '교사 67% "학생의 조롱-혐오표현 경험"', summary: '교사 10명 중 7명에 가까운 67%가 학생으로부터 조롱이나 혐오 표현을 경험한 것으로 나타났다. 교권 침해가 신체적 폭력을 넘어 언어적 폭력으로도 광범위하게 발생하고 있음이 확인됐다.', source: '동아일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/020/0003732288?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/07/08/0003732288_001_20260708043321228.jpg?type=w800' },
                { date: '2026-07-08', title: '"다문화 친구와 다른 점? 없어요!"…교실에서 배우는 \'함께 사는 법\'', summary: '다문화 학생이 늘어나는 교실에서 학생들이 자연스럽게 공존과 배려를 배우는 사례가 소개됐다. 다양성을 일상으로 받아들이는 교육 현장의 변화와 함께 사는 법을 배우는 아이들의 이야기가 담겼다.', source: '경향신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/032/0003456694?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/032/2026/07/07/0003456694_001_20260707222613202.jpg?type=w800' },
                { date: '2026-07-08', title: 'AI로 내게 맞는 대입 분석… 무료 \'3단계 공공 상담\' 유용하네', summary: 'AI를 활용해 개인 맞춤형 대입 분석을 제공하는 무료 공공 진학 상담 서비스가 주목받고 있다. 3단계 상담 체계를 통해 수험생이 사교육 없이도 자신에게 맞는 대입 전략을 세울 수 있도록 지원한다.', source: '서울경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/081/0003659224?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/07/08/0003659224_001_20260708050242812.jpg?type=w800' },
                { date: '2026-07-09', title: '전북교육청 \'스마트폰 쉼표학교\' 추진…건강한 디지털 사용문화 정착', summary: '전북특별자치도교육청이 학생들이 자발적으로 스마트폰 사용을 줄이는 \'스마트폰 쉼표학교\'를 추진한다. 금지보다 자율적 조절 역량을 키우는 방향으로 건강한 디지털 사용문화를 정착시키겠다는 구상이다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260708000464', imageUrl: 'https://img.newspim.com/news/2026/07/08/2607081041442980_t1.jpg' },
                { date: '2026-07-09', title: '부산 초중고 AI 전면 보급 \'속도전\'…현장 안착 조건은?', summary: '부산시교육청이 초중고 전 학교에 AI 기기와 서비스를 전면 보급하는 속도전에 나서고 있다. 빠른 보급 속도만큼 교원 역량 강화와 수업 혁신이 함께 이뤄져야 현장 안착이 가능하다는 지적이다.', source: '부산일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/079/0004166455?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/079/2026/07/09/0004166455_001_20260709050114372.jpg?type=w800' },
                { date: '2026-07-09', title: '배재고 사건 재발 막으려면…"혐오 표현 선 긋는 교육 이뤄져야"', summary: '배재고 교사 폭행 사건을 계기로 학교 현장에서 혐오 표현과 폭력에 명확한 선을 긋는 교육이 이뤄져야 한다는 목소리가 높아지고 있다. 사건 재발 방지를 위한 교권 보호와 학생 인권 교육의 균형점을 찾는 논의가 이어졌다.', source: '한겨레', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/028/0002813299?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/028/2026/07/09/0002813299_001_20260709065409240.jpg?type=w800' },
                { date: '2026-07-09', title: '[기고] 고교학점제, 힘들지만 가야 하는 길', summary: '고교학점제 시행의 어려움을 인정하면서도 학생 선택권 확대와 진로 맞춤형 교육을 위해 반드시 나아가야 할 방향임을 강조한 기고다. 제도 정착을 위한 학교·교사·행정의 협력 방안을 제시했다.', source: '세계일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/022/0004141622?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/022/2026/07/08/20260708523560_20260708230511363.jpg?type=w800' },
                { date: '2026-07-10', title: '\'불안세대\' 책 들어올린 안민석…"폰 내려놓는 순간 교실이 살아난다"', summary: '안민석 경기도교육감이 청소년의 스마트폰 과의존을 다룬 \'불안세대\'를 직접 소개하며 폰 없는 교실의 필요성을 강조했다. 스마트폰을 내려놓는 것이 학생들의 주의력·사회성 회복의 출발점이라는 주장이다.', source: '이투데이', importance: 'positive', url: 'https://www.etoday.co.kr/news/view/2601851', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260709084130_2356963_1200_855.jpg' },
                { date: '2026-07-10', title: '부산교육청·영일유치원, \'AI 바이브 코딩\' 성공시켜', summary: '부산시교육청과 영일유치원이 협력해 유아 대상 AI 바이브 코딩 수업을 성공적으로 운영했다. 놀이 중심의 코딩 교육으로 유아들이 AI와 자연스럽게 친숙해지는 성과를 거뒀다.', source: '한스경제', importance: 'positive', url: 'https://www.hansbiz.co.kr/news/articleView.html?idxno=849236', imageUrl: 'https://cdn.hansbiz.co.kr/news/thumbnail/202607/849236_865914_1814_v150.jpg' },
                { date: '2026-07-10', title: '수학영재들의 아버지 "수능수학 쉬워져도 수포자 더 늘어난 이유는…"', summary: '수학 영재 교육의 권위자가 수능 수학이 쉬워졌음에도 수학 포기자가 오히려 늘어난 역설적 상황의 원인을 분석했다. 시험 난이도가 아닌 교육 방식과 흥미 유발의 실패가 수포자 증가의 근본 원인이라고 진단했다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005705464?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/07/10/0005705464_001_20260710073810985.jpg?type=w800' },
                { date: '2026-07-13', title: '김석준 교육감, \'초등학생 콘텐츠\' 끝없는 아이디어', summary: '김석준 부산교육감이 초등학생을 위한 교육 콘텐츠 개발에 끊임없는 아이디어를 쏟아내며 현장 밀착형 교육 행정을 펼치고 있다. 학생 눈높이에 맞는 콘텐츠 혁신이 교육청 주도로 이뤄지는 모습이 주목된다.', source: '한스경제', importance: 'positive', url: 'https://www.hansbiz.co.kr/news/articleView.html?idxno=849528', imageUrl: 'https://cdn.hansbiz.co.kr/news/thumbnail/202607/849528_866341_4248_v150.jpg' },
                { date: '2026-07-13', title: 'AI 수업 확산에도 전자칠판 보급 정체…강 교육감 "필수현장 우선 지원 혼란 최소화"', summary: 'AI 수업 확산 속도와 달리 전자칠판 보급은 여전히 정체 상태임이 드러났다. 강원 교육감이 예산 우선순위를 필수 현장에 두고 현장 혼란을 최소화하겠다는 방침을 밝혔다.', source: '강원도민일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/654/0000190102?sid=102', imageUrl: '' },
                { date: '2026-07-13', title: '제3국서 나고 자란 탈북민 자녀 느는데… \'北출생\'에 쏠린 지원 [심층기획-경계에 선 아이들, 북한배경학생]', summary: '제3국에서 태어나고 자란 탈북민 자녀가 빠르게 늘고 있지만 지원 체계는 여전히 북한 출생자에 집중돼 있다는 심층 기획 보도다. 다양한 배경의 북한배경학생을 아우르는 맞춤형 지원 제도 개편이 시급하다.', source: '세계일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/022/0004142560?sid=100', imageUrl: 'https://imgnews.pstatic.net/image/022/2026/07/13/20260712513095_20260713090107989.jpg?type=w800' },
                { date: '2026-07-13', title: '말 안 통하는 교실 속 열패감… 차라리 침묵 택한 아이들 [심층기획-경계에 선 아이들, 북한배경학생]', summary: '언어 장벽으로 수업을 따라가지 못하는 북한배경학생들이 열패감을 느끼며 교실에서 침묵을 선택하는 현실을 심층 취재했다. 이들을 교육 사각지대에서 끌어내기 위한 언어 지원과 심리 지원의 필요성이 강조됐다.', source: '세계일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/022/0004142464?type=journalists', imageUrl: 'https://imgnews.pstatic.net/image/022/2026/07/12/20260712513236_20260712230507671.jpg?type=w800' },
                { date: '2026-07-13', title: '[요즘N] 지자체별로 신설되는 \'교권보호국\'… 교육현장 회복 위한 해답일까?', summary: '일부 지자체가 교권 보호를 전담하는 교권보호국을 신설하는 움직임이 확산되고 있다. 조직 신설이 실제 교권 침해 예방과 교사 보호로 이어질지에 대한 현장의 기대와 우려가 함께 나온다.', source: '조선에듀', importance: 'important', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/10/2026071080132.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/10/2026071080132_0.jpg' },
                { date: '2026-07-15', title: '교권보호단 출범 하루 만에…경기교사노조 "즉시 가동해 무고성 고소 막아야"', summary: '경기도 교권보호단이 출범하자마자 경기교사노조가 무고성 고소 사건을 즉시 막아야 한다고 촉구했다. 교권 보호 기구가 실질적 역할을 하려면 조직 출범과 동시에 신속한 개입이 가능해야 한다는 현장의 목소리다.', source: '이데일리', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/018/0006330290?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/07/14/0006330290_001_20260714210011056.jpg?type=w800' },
                { date: '2026-07-15', title: '충남 교사 150명 \'AI 수업 설계자\' 전환 해법 찾았다', summary: '충남 지역 교사 150명이 AI 수업 설계자로 전환하기 위한 해법을 찾는 연수를 진행했다. 단순 AI 도구 활용을 넘어 수업 전체를 AI 중심으로 재설계하는 역량을 키우는 데 초점을 맞췄다.', source: '그린에드', importance: 'positive', url: 'https://www.greened.kr/news/articleView.html?idxno=345070', imageUrl: 'https://cdn.greened.kr/news/thumbnail/202607/345070_396082_417_v150.jpg' },
                { date: '2026-07-15', title: '"부모 찬스 넘는 공교육 찬스… 미래 역량 기르는 부산 교육"', summary: '부산시교육청이 학생들에게 부모의 경제력이나 인맥보다 더 큰 기회를 제공하는 공교육 강화에 나서고 있다는 기획 기사다. AI·디지털 교육과 글로벌 체험 프로그램으로 미래 역량을 기르는 부산 교육의 방향을 소개했다.', source: '서울경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/081/0003661260?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/07/15/0003661260_001_20260715050437657.jpg?type=w800' },
                { date: '2026-07-15', title: 'AI시대 대학, 평생교육 플랫폼 진화를', summary: 'AI 시대에 대학이 졸업 후에도 지속적으로 역량을 개발할 수 있는 평생교육 플랫폼으로 진화해야 한다는 주장이 담긴 기고다. 대학의 사회적 역할이 학위 수여를 넘어 시민의 평생 학습 허브로 확장되어야 함을 역설했다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005707434?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/07/14/0005707434_001_20260714173310292.jpg?type=w800' },
                { date: '2026-07-15', title: '수업 준비부터 행정 업무까지… 교사를 위한 AI 활용법은', summary: '수업 자료 제작·평가 설계·행정 문서 작성까지 교사의 전방위 업무에 AI를 실질적으로 적용하는 방법을 소개했다. 교사들이 AI를 효율적으로 활용해 본업인 수업에 집중할 수 있는 실천적 가이드다.', source: 'IT조선', importance: 'positive', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165764', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165764_447557_4143_v150.jpg' },
                { date: '2026-07-16', title: '서울교육청, 경제·금융교육 본격 시동… 학생 경제 이해력 지원한다', summary: '서울시교육청이 학생들의 경제·금융 이해력을 높이기 위한 교육 지원에 나선다. 금융 기관·기업과 연계한 체험형 경제교육 프로그램을 체계적으로 운영할 계획이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/15/2026071580102.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/15/2026071580102_0.jpg' },
                { date: '2026-07-16', title: '"1억원씩 나눠주면 모두 부자?"…교실에서 펼쳐진 경제 실험', summary: '경제 수업에서 \'1억원씩 나눠주면 모두 부자가 되느냐\'는 질문을 던지는 실험적 수업이 교실에서 진행됐다. 경제 불평등과 자원 배분의 개념을 체험으로 이해하게 하는 혁신적 접근이다.', source: '이투데이', importance: 'positive', url: 'https://www.etoday.co.kr/news/view/2604073', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260715142344_2359922_1199_606.jpg' },
                { date: '2026-07-16', title: '안민석 경기교육 인수위 활동 종료…"AI 시대 교육체제 전환"', summary: '안민석 경기도교육감 당선인의 인수위 활동이 종료됐다. AI 시대에 맞는 교육체제 전환을 핵심 과제로 제시하며 경기 교육 혁신 방향을 공개했다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/011/0004642049?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/07/15/0004642049_001_20260715221908648.jpg?type=w800' },
                { date: '2026-07-16', title: '안경테 툭 치니 눈 앞에 \'정답\'…시험장 \'스마트 안경\' 비상', summary: '시험장에서 AI 기능이 탑재된 스마트 안경을 착용해 정답을 화면에 띄우는 방식의 부정행위가 우려되고 있다. 첨단 기기를 활용한 새로운 형태의 시험 부정행위 차단 대책 마련이 시급하다.', source: '한겨레', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/028/0002814278?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/028/2026/07/15/0002814278_001_20260716023400279.jpg?type=w800' },
                { date: '2026-07-20', title: '작년 서울 초등생 10년만에 순유입 전환', summary: '지난해 서울 초등학생 수가 10년 만에 처음으로 순유입으로 전환됐다. 서울 학령 인구 감소 흐름이 멈추고 타 지역 학생들이 서울로 이동하는 양상이 나타나기 시작했다.', source: '동아일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/020/0003734970?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/07/20/0003734970_001_20260720043421880.jpg?type=w800' },
                { date: '2026-07-20', title: '年 5000만원 전기료 아끼고 친환경교육 교과서 된 \'옥상 발전소\'', summary: '학교 옥상에 설치된 태양광 발전소가 연간 5000만원의 전기료를 절감하며 친환경 에너지 교육의 살아 있는 교과서가 되고 있다. 학생들이 직접 발전량을 모니터링하며 탄소중립 교육을 실천하고 있다.', source: '서울경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/011/0004642813?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/07/19/0004642813_001_20260719235418653.jpg?type=w800' },
                { date: '2026-07-20', title: '경북교육청, \'AI 교육 혁신 지원단\' 출범…교실 수업 혁신 이끈다', summary: '경상북도교육청이 \'AI 교육 혁신 지원단\'을 출범해 교실 수업 혁신을 이끌 체계적 지원에 나선다. AI 활용 수업 설계부터 교사 역량 강화까지 현장 맞춤형 지원을 제공할 예정이다.', source: '스포츠동아', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/382/0001283734?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/382/2026/07/18/0001283734_001_20260718092114940.jpg?type=w800' },
                { date: '2026-07-20', title: '제주서 물꼬 튼 IB 교육… 폐교 위기 지우며 전국 확산', summary: '제주에서 시작된 IB(국제 바칼로레아) 교육이 폐교 위기에 처한 지역 학교들을 살리며 전국으로 확산되고 있다. 논술·토론 중심의 IB 프로그램이 학생들을 끌어모으는 경쟁력이 됐다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/081/0003662387?sid=102', imageUrl: '' },
                { date: '2026-07-20', title: '스마트폰 없는 새별초 보니…\'성찰 수업\'하며 학생 설득', summary: '스마트폰을 학교에서 사용하지 않는 새별초등학교의 현장을 들여다봤다. 일방적 금지가 아닌 \'성찰 수업\'을 통해 학생들이 스스로 폰과의 거리를 선택하도록 유도한 경험이 주목받고 있다.', source: '한겨레', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/028/0002814792?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/028/2026/07/20/0002814792_001_20260720072210518.jpg?type=w800' },
                { date: '2026-07-21', title: '"AI로 교사 업무 줄이고 수업 연구·맞춤형 지도는 깊이 있게" [월간AX 7월호]', summary: 'AI가 교사의 행정·반복 업무를 줄여주는 대신 교사들이 수업 연구와 학생 맞춤형 지도에 더 깊이 집중할 수 있는 환경을 만들어야 한다는 방향을 제시했다. 월간AX 7월호 기획 특집이다.', source: 'IT조선', importance: 'positive', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092166125', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092166125_447994_4310_v150.jpg' },
                { date: '2026-07-21', title: '노기현 교사 "맞춤형 AI 교육도 교사 없이는 무너진다" [월간AX 7월호]', summary: '현직 교사 노기현 씨가 AI가 아무리 발전해도 학생과의 신뢰 관계와 교사의 교육적 판단 없이는 맞춤형 AI 교육도 작동하지 않는다고 강조했다. 월간AX 7월호 인터뷰다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092166126', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092166126_447986_2034_v150.jpg' },
                { date: '2026-07-21', title: '전남광주교육청, 영·유아 대상 찾아가는 문화예술 체험 지원', summary: '전남광주교육청이 영유아를 대상으로 찾아가는 문화예술 체험 프로그램을 지원한다. 기관이나 가정을 직접 방문해 영유아들이 일상 속에서 문화예술을 자연스럽게 접할 수 있도록 하는 사업이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/20/2026072080132.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/20/2026072080130_0.jpg' },
                { date: '2026-07-21', title: '초등 성취기준 70% 의무 평가 폐지에 도 교육계 환영', summary: '정부가 초등학교 성취기준의 70%를 의무적으로 평가하도록 한 규정을 폐지하기로 하면서 강원도 교육계가 환영 입장을 표명했다. 교사들이 수업 내용과 평가를 자율적으로 설계할 수 있는 여지가 넓어질 전망이다.', source: '강원도민일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/654/0000191259?sid=102', imageUrl: '' },
                { date: '2026-07-21', title: '학폭 기록 사라지고… 교사는 대입 반영 학생부 \'복붙\'', summary: '학교폭력 관련 기록 삭제 요건이 완화되면서 학생부에서 학폭 이력이 지워지고, 대입에 반영되는 학생부를 교사들이 형식적으로 복사·붙여넣기하는 관행이 문제가 되고 있다. 학생부의 신뢰성이 흔들리는 현실을 짚었다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/081/0003662720?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/07/21/0003662720_001_20260721050250271.png?type=w800' },
                { date: '2026-07-21', title: 'AI교육 확대에 정보교사 수요 급증하는데...사범대는 전국 9곳뿐', summary: 'AI 교육 수요가 급증하며 정보 교사가 절실히 필요한 상황이지만 정보 교육을 담당할 교사를 양성하는 사범대 정보교육과는 전국에 단 9곳뿐이다. 교원 공급 부족이 AI 교육 확대의 발목을 잡고 있다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005388017?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/07/20/0005388017_001_20260721041845707.jpg?type=w800' },
                { date: '2026-07-23', title: '서울교육청, 교사 수업경험 교류의 장 \'2026 AI·디지털 러닝 콘페스타\' 개최', summary: '서울시교육청이 교사들이 AI·디지털 기반 수업 경험을 공유하는 \'2026 AI·디지털 러닝 콘페스타\'를 개최했다. 현장 교사들이 직접 수업 사례를 발표하고 서로 배우는 수평적 교류의 장이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/22/2026072280107.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/22/2026072280105_0.png' },
                { date: '2026-07-23', title: '교부금 못 깎는다더니…\'공짜 정책\' 쏟아낸 서울교육감', summary: '교육재정 교부금 삭감에 반대해온 서울시교육감이 정작 재정 부담이 큰 무상 지원 정책을 잇달아 내놓아 일관성 논란이 일고 있다. 교부금 옹호와 지출 확대 사이의 모순을 지적했다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003989102?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/23/0003989102_001_20260723004516012.jpg?type=w800' },
                { date: '2026-07-23', title: '정근식 "학생들 스마트폰 사용 제한 필요"', summary: '정근식 서울시교육감이 학생들의 스마트폰 사용을 제한할 필요가 있다는 입장을 밝혔다. 교육부의 스마트폰 없는 학교 시범 정책에 보조를 맞추는 서울 교육당국의 움직임이다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003735868?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/07/23/0003735868_001_20260723043331625.jpg?type=w800' },
                { date: '2026-07-23', title: '올해 상반기 마약류 1톤 넘게 적발... 10대 마약밀수 사범 폭증', summary: '올해 상반기 국내 마약 적발량이 1톤을 넘어선 가운데 10대 마약 밀수 사범이 급증하고 있다. 청소년층까지 마약이 침투하는 상황이 심각해지며 학교 현장의 마약 예방 교육 강화가 시급해졌다.', source: '한국일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/469/0000943677?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/469/2026/07/22/0000943677_001_20260722142814830.jpg?type=w800' },
                { date: '2026-07-23', title: '권오현 서울대 명예교수 "AI는 정보만 줄 뿐…독서로 \'사고의 지도\' 만들어야"', summary: '권오현 서울대 명예교수가 AI는 정보를 제공할 뿐이며 진정한 사고력은 독서를 통해 \'사고의 지도\'를 스스로 그려야 얻을 수 있다고 강조했다. AI 시대일수록 깊은 독서 습관이 더 중요하다는 역설적 주장이다.', source: '한국경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/015/0005312727?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/015/2026/07/22/0005312727_001_20260722235409956.jpg?type=w800' },
                { date: '2026-08-04', title: '안민석 "경기도 교권 지키기, 학교·교육청 함께할 것"', summary: '안민석 경기도교육감이 교권 보호를 위해 학교와 교육청이 함께 대응 체계를 갖춰야 한다고 밝혔다. 교권 침해 사건이 잇따르는 가운데 교육청 차원의 실질적 지원 강화를 예고했다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006343563?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/08/04/0006343563_001_20260804040218340.jpg?type=w800' },
                { date: '2026-08-04', title: '"AI 수업 듣는다고 전문가 되나요?"…정보교사가 말하는 진짜 \'AI 시대 인재\'는', summary: '현직 정보교사가 AI 수업을 수강하는 것만으로 AI 전문가가 될 수 없다며, 진정한 AI 시대 인재는 비판적 사고력과 문제 정의 능력을 갖춘 사람이어야 한다고 강조했다. AI 도구 활용 교육의 한계와 진짜 역량의 의미를 현장에서 짚었다.', source: '뉴스핌', importance: 'important', url: 'https://www.newspim.com/news/view/20260731001230', imageUrl: 'https://img.newspim.com/news/2026/07/31/2607311600570490_961_tc.jpg' },
                { date: '2026-08-04', title: '[르포]"AI는 도구일뿐, 결정은 우리 몫"…아이들 스스로 답을 찾다', summary: 'AI를 활용한 수업에서 아이들이 AI를 정답을 내주는 기계가 아닌 탐구의 도구로 활용하며 스스로 답을 찾아가는 과정을 르포로 담았다. AI 시대에도 주체적 사고와 결정력이 아이들에게 가장 중요한 역량임을 현장에서 확인했다.', source: '머니투데이', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/008/0005395098?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/08/04/0005395098_001_20260804041825368.jpg?type=w800' },
                { date: '2026-08-04', title: '그림책을 펼치면 질문이 시작된다', summary: '그림책이 아이들의 질문과 사고를 촉진하는 유용한 교육 도구로 재조명되고 있다. 단순한 이야기책을 넘어 아이들이 세상에 대해 묻고 탐구하는 출발점이 된다는 점에서 그림책의 교육적 가치가 주목받는다.', source: '한겨레', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/028/0002816928?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/028/2026/08/03/0002816928_001_20260804023259918.jpg?type=w800' },
                { date: '2026-08-05', title: '\'AI 리터러시 교육 가이드라인\' 제정…9월부터 시행', summary: 'AI 리터러시 교육을 위한 가이드라인이 제정돼 오는 9월부터 학교 현장에 시행된다. 학생들이 AI를 비판적으로 이해하고 올바르게 활용할 수 있도록 체계적인 교육 기준이 마련됐다.', source: '부산일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/079/0004175323?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/079/2026/08/04/0004175323_001_20260804143614089.jpg?type=w800' },
                { date: '2026-08-05', title: '"기초학력부터 다시 세워 경남교육 살릴 것"', summary: '경남 신임 교육감이 기초학력 강화를 최우선 과제로 내세우며 경남 교육 살리기에 나서겠다고 밝혔다. 학력 저하 문제를 교육 위기의 근본 원인으로 진단하고 체계적인 기초학력 회복 방안을 추진할 계획이다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005716593?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/08/04/0005716593_001_20260804175322240.jpg?type=w800' },
                { date: '2026-08-06', title: '"고교선 실무교육, 취업 후엔 사내대학…일·학업 선순환 구조 구축해야"', summary: '고등학교에서 실무 교육을 강화하고 취업 이후에는 사내대학을 통해 학업을 이어갈 수 있는 일·학습 선순환 구조를 구축해야 한다는 제안이 나왔다. 학력과 직업 경력을 동시에 쌓을 수 있는 유연한 교육 체계의 필요성을 강조했다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006345434?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/08/06/0006345434_001_20260806050211534.jpg?type=w800' },
                { date: '2026-08-06', title: '당신이 방금 읽은 \'AI 텍스트\'는 검증 받은 글일까… AI 출판의 경고장', summary: 'AI가 생성한 텍스트가 검증 없이 출판되고 유통되는 현실에 경고를 보내는 기사다. AI 글쓰기 도구의 확산으로 오류·편향이 담긴 콘텐츠가 검증 절차를 거치지 않고 독자에게 전달되는 AI 출판 시대의 위험성을 짚었다.', source: '더스쿠프', importance: 'important', url: 'https://n.news.naver.com/mnews/article/665/0000007889?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/665/2026/08/05/0000007889_001_20260805194507513.jpg?type=w800' },
                { date: '2026-08-06', title: '전북교육청 "AI로 교육행정 혁신"…실무추진단 본격 가동', summary: '전북교육청이 AI를 활용한 교육행정 혁신을 위해 실무추진단을 본격 가동했다. 행정 업무의 AI 자동화와 데이터 기반 의사결정 체계 구축을 통해 교육 행정의 효율성을 높인다는 계획이다.', source: '뉴스1', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/421/0009099215?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/421/2026/08/05/0009099215_001_20260805171115955.jpg?type=w800' },
                { date: '2026-08-07', title: '고교생이 만든 \'1만명 접속 플랫폼\'…"기업 실무자도 깜짝 놀라"', summary: '고등학생이 직접 개발한 플랫폼이 1만 명 이상의 사용자를 확보하며 기업 실무자들도 놀라게 하는 수준의 완성도를 보였다. 교실을 넘어 실제 서비스를 만드는 학생 창업·개발 역량이 주목받고 있다.', source: '매일경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/009/0005717740?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/08/06/0005717740_001_20260806202018321.jpg?type=w800' },
                { date: '2026-08-07', title: '\'대한민국 과학교육상\' 휩쓴 대전교육청...과학교육 경쟁력 입증', summary: '대전교육청이 대한민국 과학교육상을 휩쓸며 과학교육 경쟁력을 입증했다. 체계적인 과학 교육 커리큘럼과 실험·탐구 중심 수업이 전국 최고 수준의 성과로 이어졌다는 평가다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260806000916', imageUrl: 'https://img.newspim.com/news/2026/08/06/2608061431359690_t1.jpg' },
                { date: '2026-08-07', title: '대전교육 남미까지 넓힌다…재외동포 자녀·학생 교육 지원 확대', summary: '대전교육청이 남미 지역까지 재외동포 자녀와 학생을 위한 교육 지원을 확대한다. 해외 교육 협력 네트워크를 강화해 재외동포 학생들의 교육 기회를 넓히겠다는 취지다.', source: '뉴스1', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/421/0009100144?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/421/2026/08/06/0009100144_001_20260806103912814.jpg?type=w800' },
                { date: '2026-08-07', title: '서울교육감 "교육교부금 개편 땐 \'교육 홀대 정부\'라는 역사적 평가 받을 것"', summary: '서울 교육감이 교육교부금 개편 추진에 강하게 반발하며 역사적 평가를 경고했다. 지방교육재정교부금 축소가 교육 현장에 미칠 부작용을 우려하는 교육계의 반발이 거세지고 있다.', source: '한국일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/469/0000946552?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/469/2026/08/06/0000946552_001_20260807061316542.jpg?type=w800' },
                { date: '2026-08-10', title: '경남교육청, 글로벌 인공지능·디지털 교육의 해법 모색 위한 글로벌 현장 찾아', summary: '경남교육청이 AI·디지털 교육의 해법을 찾기 위해 글로벌 현장을 직접 탐방했다. 세계 선도 사례를 현장에서 배우고 경남 교육에 적용할 수 있는 실질적 아이디어를 발굴하겠다는 취지다.', source: '매일신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/088/0001022703?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/088/2026/08/09/0001022703_001_20260809121015421.png?type=w800' },
                { date: '2026-08-10', title: '유치원 교사 절반은 휴가도 포기⋯"대체인력 없어 눈치만"', summary: '유치원 교사의 절반가량이 대체인력 부족으로 눈치 보며 휴가를 포기하는 것으로 나타났다. 교원 복지 사각지대가 방치되면서 보육 현장의 교사 소진이 심각해지고 있다는 우려가 커지고 있다.', source: '이투데이', importance: 'important', url: 'https://www.etoday.co.kr/news/view/2612078', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/08/20260807101200_2369994_1200_800.jpg' },
                { date: '2026-08-10', title: '"질문이 배움의 시작"…증평중 문수미 교사, \'질문 중심 수업\' 전국 대상', summary: '증평중학교 문수미 교사가 학생의 질문을 수업의 출발점으로 삼는 \'질문 중심 수업\' 모델로 전국 대상을 수상했다. 학생 주도 질문이 학습 동기와 사고력 향상에 효과적임을 입증한 혁신적인 교수 방법으로 주목받고 있다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260809000010', imageUrl: 'https://img.newspim.com/news/2026/08/09/2608090853237130_t1.jpg' },
                { date: '2026-08-10', title: 'AI 교실, 핵심은 \'누가, 어떻게 가르칠 것인가\'…부산에 모인 교사들', summary: 'AI를 도입한 교실의 성패는 기술이 아닌 교사의 역량에 달려 있다는 공감대 아래 부산에서 교사들이 모여 AI 교육의 방향을 논의했다. AI 도구를 실제 수업에 어떻게 접목할지에 대한 교사 역할 재정립 논의가 활발하게 이루어졌다.', source: '전자신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/030/0003455404?sid=100', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/09/0003455404_001_20260809193213453.png?type=w800' },
                { date: '2026-08-10', title: '알고리즘 \'토끼굴\'에 중독된 청소년들…칼 빼든 정부는 그들을 보호할 수 있나', summary: '추천 알고리즘이 만드는 \'토끼굴\' 현상에 빠진 청소년들의 SNS 중독 문제가 심각해지면서 정부가 규제 대응에 나섰다. 알고리즘 규제와 청소년 보호의 효과성을 둘러싼 논쟁이 이어지는 가운데 실질적인 보호 방안 마련이 시급하다는 지적이다.', source: '경향신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/032/0003463220?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/032/2026/08/09/0003463220_001_20260809214909885.jpg?type=w800' },
                { date: '2026-08-10', title: '\'교육 1번지\' 강남 서초 초등교사, 스트레스도 1위', summary: '교육 특구로 불리는 강남·서초 지역 초등교사들의 직무 스트레스가 전국 최고 수준인 것으로 나타났다. 학부모 민원과 높은 교육열이 교사들에게 극심한 심리적 부담으로 작용하는 현실이 수치로 드러났다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005718624?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/08/09/0005718624_001_20260809195307605.jpg?type=w800' },
                { date: '2026-08-11', title: '"AI 시대에도 교육의 중심은 교사"…미래수업 혁신사례 코엑스 집결', summary: 'AI 시대에도 교육의 핵심은 교사라는 인식 아래 미래 수업 혁신 사례들이 코엑스에 집결했다. 전국 교사들이 AI 도구를 활용한 수업 혁신 모델을 공유하며 교사 주도의 미래 교육 방향을 모색했다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005397908?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/08/10/0005397908_001_20260810155712640.jpg?type=w800' },
                { date: '2026-08-11', title: '서울, 이르면 9월부터 3살도 무상교육…1조1711억 추경 편성', summary: '서울시가 이르면 9월부터 만 3세 아동까지 무상교육을 확대하기 위해 1조 1711억원 규모의 추가경정예산을 편성했다. 유아 교육 접근성을 높이고 학부모 교육비 부담을 줄이기 위한 선제적 투자다.', source: '한겨레', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/028/0002817833?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/028/2026/08/10/0002817833_001_20260810202007572.jpg?type=w800' },
                { date: '2026-08-11', title: '충남교육청, 유보통합 시범사업 성과 공유…현장 협력 강화', summary: '충남교육청이 유보통합 시범사업의 성과를 현장과 공유하며 협력 체계를 강화했다. 유치원과 어린이집의 통합 운영 경험을 쌓으며 2030년 완성을 목표로 하는 유보통합의 현장 기반을 다지고 있다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260810001256', imageUrl: 'https://img.newspim.com/news/2026/08/10/2608101704284460_t1.jpg' },
                { date: '2026-08-11', title: '경기도교육청, 뉴질랜드 한글학교와 한국어교육·문화교류 확대', summary: '경기도교육청이 뉴질랜드 한글학교와 협력해 현지 한국어 교육과 문화 교류를 확대한다. 해외 재외동포 자녀의 한국어 교육 기회를 넓히고 한국 문화 알리기에 힘을 보태는 국제 교육 협력이다.', source: '로이슈', importance: 'positive', url: 'https://www.lawissue.co.kr/view.php?ud=2026081021311774d94aa4ada6_12', imageUrl: '' },
                { date: '2026-08-11', title: '김태헌 대한출판문화협회 회장 "AI 시대일수록 인간의 사고력 담은 책의 가치는 더 커져" [세계초대석]', summary: '김태헌 대한출판문화협회 회장이 AI 시대에도 인간의 사고력과 감수성을 담은 책의 가치는 오히려 더 높아질 것이라고 강조했다. AI가 정보를 제공하더라도 책이 담고 있는 깊은 사유와 공감의 힘은 대체될 수 없다는 시각을 제시했다.', source: '세계일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/022/0004149971?sid=103', imageUrl: 'https://imgnews.pstatic.net/image/022/2026/08/11/20260810518154_20260811072107280.jpg?type=w800' },
                { date: '2026-08-13', title: '"AI에 묻지 마" 대신 "좋은 질문 만들어봐"… 수업이 달라졌다', summary: 'AI에 정답을 의존하는 대신 학생 스스로 좋은 질문을 만들도록 유도하는 수업 방식이 확산되고 있다. AI를 활용하되 학생의 사고 과정을 살리는 방향으로 수업 설계를 바꾸는 교육 현장의 변화가 주목된다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003740576?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/08/13/0003740576_001_20260813043511074.jpg?type=w800' },
                { date: '2026-08-13', title: '"0~5세 일괄통합 안 돼"… 유치원·어린이집·학부모 단체, 국가교육위에 보고서 폐기 촉구', summary: '유치원·어린이집 및 학부모 단체들이 국가교육위원회에 0~5세 일괄 유보통합 방향을 담은 보고서 폐기를 촉구했다. 연령별 발달 특성을 무시한 일괄 통합에 대한 현장의 반발이 거세지고 있다.', source: '베이비뉴스', importance: 'important', url: 'https://www.ibabynews.com/news/articleView.html?idxno=153656', imageUrl: 'https://www.ibabynews.com/news/photo/202608/153656_119460_4415.jpg' },
                { date: '2026-08-13', title: 'AI에 생각 맡기는 \'사고 외주화\' 막는다…정답 대신 소크라테스식 되묻는 AI 확산', summary: '학생들이 AI에 생각을 맡기는 \'사고 외주화\' 현상을 막기 위해 정답을 바로 알려주는 대신 소크라테스식 질문으로 되묻는 AI 교육 도구가 확산되고 있다. 스스로 생각하는 능력을 기르는 방향으로 교육용 AI 설계 철학이 바뀌고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003992586?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/12/0003992586_001_20260812143308246.jpg?type=w800' },
                { date: '2026-08-13', title: '\'스마트폰 없는 학교\' 2학기부터 전국 확대', summary: '2학기부터 스마트폰 사용을 제한하는 \'스마트폰 없는 학교\'가 전국으로 확대 시행된다. 학생들의 스마트폰 과의존과 수업 집중도 저하 문제를 해소하기 위한 정책적 결단이다.', source: '한국경제', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/015/0005320235?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/015/2026/08/12/0005320235_001_20260813003712475.jpg?type=w800' },
                { date: '2026-08-13', title: '[ET시론] AI 시대, 다시 \'익힘\'을 말하는 이유', summary: 'AI가 지식을 대신 처리해 주는 시대에도 반복적인 \'익힘\'을 통한 숙달의 중요성을 다시 강조하는 시론이다. 기술 도구가 아무리 발전해도 인간의 깊은 학습은 익힘의 과정을 통해서만 완성된다는 주장이다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003456808?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/12/0003456808_001_20260812192313308.jpg?type=w800' },
                { date: '2026-08-13', title: '61점으로 하락한 서울대생 글쓰기 점수 [지금, 대학을 묻다]', summary: '서울대 신입생들의 글쓰기 역량 점수가 61점까지 하락한 것으로 나타났다. AI 의존도 증가와 논술 교육 부재가 맞물려 최상위권 대학생들의 기본 글쓰기 능력이 저하되고 있다는 우려가 제기된다.', source: '한국일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/469/0000947734?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/469/2026/08/13/0000947734_001_20260813061338114.png?type=w800' },
                { date: '2026-08-13', title: '\'심청전\' 등 K동화, 중남미 5개국 교과서에 실렸다', summary: '심청전 등 한국 전통 동화가 중남미 5개국의 교과서에 수록되며 K-콘텐츠의 교육적 영향력이 확대되고 있다. 한류의 흐름을 타고 한국 문화와 이야기가 세계 교육 현장으로 뻗어나가는 사례다.', source: '서울경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/011/0004651224?sid=103', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/08/13/0004651224_001_20260813063108498.jpg?type=w800' },
                { date: '2026-08-18', title: '휴대폰 막았더니 학습용 태블릿으로… \'PC방\' 된 교실', summary: '스마트폰 사용을 금지했더니 학생들이 학습용 태블릿으로 게임을 즐기며 교실이 PC방처럼 변했다는 현장 보고가 나왔다. 기기 규제만으로는 해결되지 않는 학생 디지털 사용 문제의 구조적 한계를 보여준다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003993461?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/18/0003993461_001_20260818004508040.jpg?type=w800' },
                { date: '2026-08-18', title: '\'책 읽는 습관부터 문해력까지\'…경기도, 어린이 독서 코칭', summary: '경기도가 어린이들의 독서 습관 형성과 문해력 향상을 위한 독서 코칭 프로그램을 운영한다. AI 시대 문해력 기초를 닦는 독서 교육 강화가 지역 교육 정책으로 확산되고 있다.', source: '아시아경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/277/0005803812?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/277/2026/08/18/0005803812_001_20260818071421531.png?type=w800' },
                { date: '2026-08-18', title: '[기고] 서술·논술형 평가 도입하면 입시 혼란과 사교육 부른다', summary: '수능에 서술·논술형 평가를 도입할 경우 채점 공정성 시비와 사교육 팽창이라는 부작용이 불가피하다는 기고 의견이 제시됐다. 평가 방식 전환의 취지와 현실적 한계를 짚으며 신중한 접근을 촉구했다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003993406?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/17/0003993406_001_20260817233107174.jpg?type=w800' },
                { date: '2026-08-19', title: '서울 학생 569명, 2학기 농촌학교로', summary: '서울 학생 569명이 2학기부터 농촌 학교에서 수업을 받는 농촌 유학 프로그램에 참여한다. 도시 학생들에게 농촌 생활과 자연 교육을 경험하게 하며 지역 소규모 학교의 활성화에도 기여하는 프로그램이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/08/18/2026081880036.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/08/18/2026081880034_0.jpg' },
                { date: '2026-08-19', title: '서울시교육청, 전국 유아 독서교육 교원 연수…유치원·어린이집 551명 참여', summary: '서울시교육청이 전국 유아교육기관 교원을 대상으로 독서교육 연수를 실시해 유치원과 어린이집 교사 551명이 참여했다. 영유아 단계부터 독서 습관을 길러주기 위한 교사 역량 강화에 나서고 있다.', source: '뉴스1', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/421/0009120002?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/421/2026/08/19/0009120002_001_20260819060022102.jpg?type=w800' },
                { date: '2026-08-19', title: '전남광주 교사들, 캄보디아·베트남서 한국어 교육 문화 홍보', summary: '전남·광주 지역 교사들이 캄보디아와 베트남에서 한국어 교육과 한국 문화를 직접 알리는 활동을 펼쳤다. 현지에서 한국어 교육 수요가 높아지는 가운데 한국 교사들이 직접 해외로 나가 문화 교류와 언어 보급에 앞장섰다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260818001113', imageUrl: 'https://img.newspim.com/news/2026/08/18/2608181603280410_t1.jpg' },
                { date: '2026-08-21', title: '초등 사회교과서 아프리카 왜곡 줄었다…"발전 가능성 부각"', summary: '초등학교 사회 교과서에서 아프리카를 빈곤과 분쟁의 시각으로 왜곡하는 서술이 줄고 발전 가능성을 부각하는 방향으로 개선됐다. 다양한 지역에 대한 균형 잡힌 시각을 키우는 교과서 개편의 성과가 확인됐다.', source: '연합뉴스', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/001/0016260752?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/001/2026/08/20/AKR20260819147551898_03_i_P4_20260820112829402.jpg?type=w800' },
                { date: '2026-08-21', title: '초등생 절반은 "걸으며 스마트폰 사용"… 눈높이 낮아 사고위험 커', summary: '초등학생 절반이 보행 중 스마트폰을 사용한다는 조사 결과가 나왔다. 어린이는 시야가 좁고 눈높이가 낮아 보행 중 스마트폰 사용이 성인보다 사고 위험이 훨씬 크다는 경고가 제기됐다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003742380?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/08/21/0003742380_001_20260821043623305.jpg?type=w800' },
                { date: '2026-08-21', title: '서울교육청, 자치구와 함께 유보통합 기반 강화', summary: '서울시교육청이 자치구와 협력해 유보통합을 위한 인프라와 협력 기반을 강화하는 작업에 나섰다. 유치원과 어린이집의 통합 체계 구축을 위한 지역 단위 협력 모델이 서울에서 구체화되고 있다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/08/20/2026082080086.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/08/20/2026082080085_0.png' },
                { date: '2026-08-21', title: '강원 초등생, 3년 후 5만 명 선 붕괴', summary: '강원도 초등학생 수가 3년 후 5만 명 선마저 무너질 것으로 전망되며 지방 교육 위기가 현실화되고 있다. 학령인구 감소가 가속화되면서 소규모 학교 폐교와 교육 서비스 축소에 대한 우려가 커지고 있다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003742341?sid=102', imageUrl: '' },
                { date: '2026-08-21', title: '"학원 대신 교육청이 진학 상담"… 지원 가능 고3 35% 그쳐', summary: '교육청이 학원을 대신해 고3 진학 상담을 지원하는 서비스를 운영하지만 실제 지원 가능한 고3은 전체의 35%에 불과한 것으로 나타났다. 공교육 안에서의 진학 상담 확대 취지에도 불구하고 수요를 충족하기 위한 인력과 인프라가 부족한 현실이다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003742372?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/08/21/0003742372_001_20260821043601190.jpg?type=w800' },
                { date: '2026-08-21', title: '대학가 AI 토큰 비용 골치…비용 효율 높이는 활용체계 절실', summary: '대학들이 AI 서비스 이용에 드는 토큰 비용 급증으로 골머리를 앓고 있다. 연구·교육 목적의 AI 활용이 늘어나면서 비용 효율을 높이는 체계적인 AI 활용 관리 방안 마련이 시급하다는 지적이다.', source: '전자신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/030/0003459048?sid=100', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/20/0003459048_001_20260820194739945.png?type=w800' },
                { date: '2026-08-21', title: '[이광형의 퍼스펙티브] AI 시대의 교육, \'불변의 인간성\' 돌아봐야', summary: 'AI 시대를 맞아 교육의 방향을 논하면서 기술 변화에도 흔들리지 않는 \'불변의 인간성\'을 교육의 핵심으로 돌아봐야 한다는 시각이 제시됐다. AI가 지식 전달을 대체하는 시대에 인간만이 갖는 본질적 가치와 역량을 기르는 교육의 중요성을 강조했다.', source: '중앙일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/025/0003545803?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/025/2026/08/21/0003545803_001_20260821001510025.jpg?type=w800' },
                { date: '2026-08-24', title: '대전교육청, 2026 영유아 대상 맞춤형 다문화 교육 지원 강화', summary: '대전시교육청이 영유아를 대상으로 한 맞춤형 다문화 교육 지원을 강화한다고 밝혔다. 다양한 문화적 배경을 가진 영유아들이 안정적으로 교육 환경에 적응할 수 있도록 지원 체계를 정비하는 계획이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/08/21/2026082180131.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/08/21/2026082180126_0.jpg' },
                { date: '2026-08-24', title: '전북, AI 교육 가이드라인 전국 첫 마련…생기부 정성적 평가에 활용 금지', summary: '전라북도가 전국 최초로 학교 AI 교육 가이드라인을 마련하고, 생활기록부의 정성적 평가 항목에 AI 활용을 금지하는 지침을 포함했다. AI 도구 사용이 확산되는 상황에서 공정한 학생 평가를 위한 기준을 선제적으로 확립한 사례로 주목된다.', source: '경향신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/032/0003465924?sid=102', imageUrl: '' },
                { date: '2026-08-24', title: '전북교육청, 소규모 학교 운영 지원… \'2027년 전북 올봄(ALL)학교\' 운영', summary: '전북교육청이 학생 수 감소로 위기에 처한 소규모 학교를 살리기 위해 \'전북 올봄(ALL)학교\' 모델을 2027년부터 운영하기로 했다. 소규모 학교의 교육 경쟁력을 높이고 지역 교육 공동화를 막기 위한 대안적 운영 방식이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/08/21/2026082180138.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/08/21/2026082180133_0.jpg' },
                { date: '2026-08-24', title: '\'독서 연계 읽기·쓰기\'…세종교육문화원, 읍·면 초등생 문해력 키운다', summary: '세종교육문화원이 읍·면 지역 초등학생을 대상으로 독서와 연계한 읽기·쓰기 통합 교육 프로그램을 운영해 문해력 향상에 나섰다. 도시 지역과의 교육 격차를 줄이기 위한 지역 맞춤형 문해 교육 지원이다.', source: '뉴스핌', importance: 'positive', url: 'https://www.newspim.com/news/view/20260821000907', imageUrl: 'https://img.newspim.com/news/2026/08/21/2608211753108650_t1.jpg' },
                { date: '2026-08-24', title: '[단독]한국연구재단 "내년 IR센터 신설…성과 좋은 대학에 재정 더 줄 것"', summary: '한국연구재단이 내년 IR(기관 연구역량 평가)센터를 신설하고, 연구 성과가 우수한 대학에 재정을 더 배분하는 성과 연동형 지원 방식을 도입하겠다고 밝혔다. 대학 재정 지원 방식을 경쟁·성과 중심으로 전환하는 구조 개편이다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/011/0004654290?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/08/23/0004654290_001_20260823233645167.jpg?type=w800' },
                { date: '2026-08-24', title: '"AI 쓰는 학생은 넘치는데 \'AI로 일할 줄 아는\' 졸업생은 부족"', summary: '학생들의 AI 도구 사용은 보편화됐지만 실제 업무에서 AI를 활용해 성과를 내는 능력을 갖춘 졸업생은 턱없이 부족하다는 지적이 제기됐다. AI 리터러시를 넘어 실무 역량으로 연결되는 교육 과정 설계의 필요성이 강조됐다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006356683?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/08/24/0006356683_001_20260824020213465.jpg?type=w800' },
                { date: '2026-08-25', title: '"교사 보호가 교육 전체 보호"…경기교육 1호 교권보호전담관들의 일성', summary: '경기도교육청이 전국 첫 교권보호전담관을 임명한 가운데, 이들은 교사를 보호하는 것이 곧 교육 전체를 지키는 일이라는 소신을 밝혔다. 교권 침해 문제를 전담 인력이 체계적으로 대응하는 새로운 교권 보호 모델이 경기도에서 시작됐다.', source: '중앙일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/025/0003546333?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/025/2026/08/24/0003546333_001_20260824144219962.jpg?type=w800' },
                { date: '2026-08-25', title: '충남형 교권보호관 다음 달 출범', summary: '충청남도교육청이 교권 보호를 위한 충남형 교권보호관 제도를 다음 달 출범시킨다. 교사들의 교권 침해 피해를 전담 지원하는 지역 맞춤형 교권 보호 체계가 본격적으로 가동된다.', source: '서울신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/081/0003673131?sid=102', imageUrl: '' },
                { date: '2026-08-25', title: '부산교육청, 교사 300명 모아 \'수업 혁신\' 해법 찾는다…"가르치는 수업에서 질문하는 수업으로"', summary: '부산시교육청이 교사 300명을 한자리에 모아 수업 혁신 방향을 함께 모색하는 행사를 열었다. 교사가 일방적으로 가르치는 수업에서 학생이 스스로 질문하고 탐구하는 수업으로의 전환을 핵심 과제로 제시했다.', source: '이투데이', importance: 'positive', url: 'https://www.etoday.co.kr/news/view/2617294', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/08/20260824092344_2376997_1124_635.png' },
                { date: '2026-08-25', title: '\'정치 편향\' 민원에, 민주교육 꺼리는 교실', summary: '특정 정치 성향으로 오해받을 수 있다는 민원이 두려워 교사들이 민주주의 교육 자체를 꺼리는 현상이 심화되고 있다. 교육 현장에서 민주시민 교육이 위축되는 역설적 상황이 벌어지고 있다는 우려가 제기됐다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005404063?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/08/25/0005404063_001_20260825040416670.jpg?type=w800' },
                { date: '2026-08-25', title: '[세종로의 아침] 7세가 \'비문학 독해\' 문제집 푸는 나라', summary: '7세 아이가 비문학 독해 문제집을 풀 정도로 과도한 선행학습과 학습 경쟁이 저연령화되고 있는 현실을 짚은 칼럼이다. 어린 시절부터 시험 대비 학습에 내몰리는 아이들의 실태와 이를 당연하게 여기는 교육 문화에 대한 성찰을 담았다.', source: '서울신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/081/0003673180?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/08/25/0003673180_001_20260825051215493.png?type=w800' },

                { date: '2026-06-15', title: '김재원 코스포 의장 "AI 생태계 조성, 대기업-中企 원하청 구조 혁신부터"', summary: '김재원 코리아스타트업포럼 의장이 AI 생태계 조성을 위해서는 대기업과 중소기업 간 원하청 구조 혁신이 먼저 이뤄져야 한다고 강조했다. 스타트업의 AI 기술 경쟁력 확보를 위한 산업 구조 개선의 필요성을 제기했다.', source: '이코노미스트', importance: 'important', url: 'https://n.news.naver.com/mnews/article/243/0000099129?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/243/2026/06/15/0000099129_001_20260615070113647.jpg?type=w800' },

                { date: '2026-06-22', title: '[에듀플러스]〈칼럼〉학교에는 \'공교육 특화AI\'가 필요하다', summary: '학교 현장에는 범용 AI가 아닌 공교육에 특화된 AI가 필요하다는 칼럼이 게재됐다. 교육과정과 학교 환경에 최적화된 AI 도구 개발의 필요성을 강조하며 공교육 맞춤형 AI 전략을 제안한다.', source: '전자신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/030/0003439580?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/06/21/0003439580_001_20260621193935659.jpg?type=w800' },
                { date: '2026-06-23', title: '아이스크림에듀, 독서 철학과 핵심 경쟁력 담아 \'홈런\' 홈페이지 리뉴얼 오픈', summary: '아이스크림에듀가 자사의 독서 철학과 핵심 경쟁력을 담아 \'홈런\' 홈페이지를 리뉴얼 오픈했다. 학습 플랫폼의 브랜드 정체성 강화와 사용자 경험 개선을 동시에 추진하는 행보다.', source: '에듀동아', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=109112', imageUrl: 'https://cdn.edu.donga.com/news/photo/202606/109112_173334_4941.jpg' },
                { date: '2026-06-23', title: '미래엔, 언어감수성·창의성 지원한다… 2026 초등 손글씨 공모전 및 글감 공모전 개최', summary: '미래엔이 초등학생의 언어 감수성과 창의성을 키우기 위한 2026 손글씨 공모전 및 글감 공모전을 개최한다. 디지털 시대에도 손글씨와 글쓰기 교육의 가치를 강조하는 행사다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/06/22/2026062280038.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/06/22/2026062280038_0.jpg' },
                { date: '2026-06-23', title: '동아출판, AI 교육자료 수업 사례 공모전 개최', summary: '동아출판이 AI 디지털 교육자료를 활용한 수업 사례 공모전을 개최한다. 현장 교사들의 AI 교육자료 활용 우수 사례를 발굴하고 공유하는 자리를 마련했다.', source: '한스경제', importance: 'positive', url: 'https://www.hansbiz.co.kr/news/articleView.html?idxno=845693', imageUrl: 'https://cdn.hansbiz.co.kr/news/thumbnail/202606/845693_860580_336_v150.jpg' },
                { date: '2026-06-23', title: '[에듀플러스]"표준 없인 AI도 길 잃어"…원에듀테크 코리아, AI 시대 에듀테크 생태계 만든다', summary: '원에듀테크 코리아가 AI 시대 에듀테크 표준의 중요성을 강조하며 생태계 구축에 나선다. 표준화 없이는 AI 기반 교육 서비스의 호환성과 품질 보장이 어렵다는 문제 의식을 제기했다.', source: '전자신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/030/0003440071?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/06/22/0003440071_001_20260622180910478.jpg?type=w800' },
                { date: '2026-06-24', title: '천재교육·천재교과서 T셀파(티셀파), Q.U.O.K.A 연구회와 \'2026 디지털센서·AI 과학에듀톤 대회\' 개최', summary: '천재교육과 천재교과서가 Q.U.O.K.A 연구회와 함께 디지털 센서와 AI를 활용한 과학에듀톤 대회를 개최한다. 교사와 학생이 함께 참여하는 AI 과학 교육 경진대회로 현장 혁신을 촉진한다.', source: '에듀동아', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=109172', imageUrl: 'https://cdn.edu.donga.com/news/photo/202606/109172_173394_2425.png' },

                { date: '2026-06-24', title: '팀스파르타 "교육·구축·컨설팅까지…AX \'엔드투엔드\' 책임진다"', summary: '팀스파르타가 AI 전환(AX)을 교육·구축·컨설팅까지 엔드투엔드로 책임지겠다는 전략을 밝혔다. 기업의 AI 도입 전 과정을 원스톱으로 지원하는 종합 AX 서비스 모델을 제시했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212031', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/212031_215195_2012.png' },
                { date: '2026-06-24', title: '마지막 렌털 계열사도 정리…웅진 37년 가전史 막내려', summary: '웅진그룹이 마지막 렌털 계열사까지 정리하며 37년간 이어온 가전 사업의 역사에 막을 내렸다. 교육 중심 사업으로의 체질 전환을 가속화하는 구조조정의 일환이다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/011/0004634175?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/06/23/0004634175_001_20260623233347628.jpg?type=w800' },

                { date: '2026-07-15', title: '리딩앤스쿨, 시도교육청 AI 교육 플랫폼 5곳에 영어독서 서비스 선정', summary: '리딩앤스쿨이 시도교육청의 AI 교육 플랫폼 5곳에 영어독서 서비스 공급업체로 선정됐다. AI 기반 개인 맞춤형 영어독서 프로그램이 공교육 디지털 전환의 공식 서비스로 채택됐다는 의미가 크다.', source: '헬로티', importance: 'positive', url: 'https://www.hellot.net/news/article.html?no=113773', imageUrl: 'https://www.hellot.net/data/photos/20260729/art_17840191323531_5e94af.jpg' },
                { date: '2026-07-15', title: '천재교육, \'T셀파\' 교사 콘텐츠 제작 파트너 모집', summary: '천재교육이 자사 교사 지원 플랫폼 T셀파에서 교사 크리에이터를 모집한다. 현직 교사들이 직접 수업 콘텐츠를 제작하고 공유하는 교사 주도형 에듀 콘텐츠 생태계 구축에 나서는 것이다.', source: '이데일리', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/018/0006329727?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/07/14/0006329727_001_20260714093509121.jpg?type=w800' },

                { date: '2026-07-16', title: '㈜미래엔, \'2026 제2회 전국 어린이 동요대회\' 참가 접수 개시', summary: '㈜미래엔이 \'2026 제2회 전국 어린이 동요대회\' 참가 접수를 시작했다. 어린이들의 음악적 감수성과 표현력을 키우는 문화 교육 행사로 참가자를 모집 중이다.', source: '에듀동아', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=109970', imageUrl: 'https://cdn.edu.donga.com/news/photo/202607/109970_174268_5549.jpg' },
                { date: '2026-07-16', title: '교육업계, 여름방학 앞두고 학생 참여형 행사 \'가득\'', summary: '교육업계가 여름방학을 앞두고 학생들이 직접 참여하는 다양한 체험 행사를 잇따라 개최한다. 캠프, 경시대회, 창작 프로그램 등 방학 기간 학생들의 학습 동기를 자극하는 이벤트가 풍성하게 마련됐다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/15/2026071580061.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/15/2026071580061_0.jpg' },
                { date: '2026-07-16', title: '한컴, 폴란드 기업과 유럽 현지 \'에이전틱 OS\' 개발 속도 낸다', summary: '한글과컴퓨터가 폴란드 기업과 손잡고 유럽 현지에서 에이전틱 OS 개발에 속도를 내고 있다. AI 에이전트 기반 운영 체계를 유럽 시장에 선보이려는 한컴의 글로벌 전략이 가시화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212783', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212783_216145_3724.jpg' },
                { date: '2026-07-20', title: '교육업계, 방학 맞아 \'페이백·선물 이벤트\'', summary: '여름방학을 맞아 주요 교육업체들이 수강료 페이백, 사은품 증정 등 다양한 프로모션 이벤트를 내놓고 있다. 방학 특수를 잡으려는 교육업계의 마케팅 경쟁이 본격화됐다.', source: '파이낸셜뉴스', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/014/0005549770?sid=101', imageUrl: '' },
                { date: '2026-07-20', title: '비상교육, 2026 레드닷 디자인 어워드 수상', summary: '비상교육이 세계 3대 디자인 어워드 중 하나인 2026 레드닷 디자인 어워드를 수상했다. 교육 콘텐츠와 교재 디자인에서 국제적 수준의 품질을 인정받은 성과다.', source: '아시아경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/277/0005791577?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/277/2026/07/20/0005791577_001_20260720074012996.jpg?type=w800' },
                { date: '2026-07-21', title: '아이스크림에듀, AI 유튜브 채널 \'뚜루마리\' 오픈', summary: '아이스크림에듀가 AI 기반 교육 콘텐츠를 제공하는 유튜브 채널 \'뚜루마리\'를 오픈했다. 어린이들이 유튜브를 통해 쉽고 재미있게 AI 개념과 디지털 소양을 익힐 수 있는 콘텐츠를 제공한다.', source: '한스경제', importance: 'positive', url: 'https://www.hansbiz.co.kr/news/articleView.html?idxno=851107', imageUrl: 'https://cdn.hansbiz.co.kr/news/thumbnail/202607/851107_868624_5354_v150.jpg' },
                { date: '2026-07-23', title: '아이스크림북스, 추리 동화 2권 출간', summary: '아이스크림북스가 어린이들의 논리적 사고력과 추론 능력을 키울 수 있는 추리 동화 2권을 새롭게 출간했다. 흥미로운 스토리 속에서 자연스럽게 사고력을 기를 수 있는 교육 도서다.', source: '한스경제', importance: 'positive', url: 'https://www.hansbiz.co.kr/news/articleView.html?idxno=851616', imageUrl: 'https://cdn.hansbiz.co.kr/news/thumbnail/202607/851616_869474_1642_v150.jpg' },
                { date: '2026-07-23', title: '웅진씽크빅-태백시지역아동센터협의회 맞손', summary: '웅진씽크빅이 태백시지역아동센터협의회와 손잡고 지역 아동들의 교육 격차 해소를 위해 협력한다. 취약계층 아동들에게 교육 콘텐츠와 지원을 제공하는 사회공헌 활동이다.', source: '조선에듀', importance: 'positive', url: 'https://edu.chosun.com/site/data/html_dir/2026/07/22/2026072280027.html', imageUrl: 'https://edu.chosun.com/site/data/img_dir/2026/07/22/2026072280027_0.jpg' },
                { date: '2026-07-23', title: '테크빌교육 초등 교원 1천 명 연수', summary: '테크빌교육이 전국 초등 교원 1,000명을 대상으로 연수 프로그램을 진행했다. 현장 교사들의 디지털·AI 교육 역량 강화를 위한 대규모 전문성 개발 프로그램이다.', source: 'CS타임즈', importance: 'positive', url: 'https://www.cstimes.com/news/articleView.html?idxno=714162', imageUrl: 'https://www.cstimes.com/news/photo/202607/714162_634304_2523.jpg' },
                { date: '2026-07-23', title: '강원교총 미래엔과 맞손', summary: '강원도교원단체총연합회가 교육 출판·에듀테크 기업 미래엔과 업무협약을 체결했다. 교원 연수와 교육 콘텐츠 협력을 통해 강원 지역 교육의 질 향상을 도모한다.', source: '강원일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/087/0001206667?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/087/2026/07/22/0001206667_001_20260722183108181.jpg?type=w800' },
                { date: '2026-08-04', title: '아이스크림에듀, 교보문고 \'어린이 책Dream 프로젝트\' 도서 선정', summary: '아이스크림에듀의 교육 도서가 교보문고 \'어린이 책Dream 프로젝트\' 선정 도서로 뽑혔다. 교보문고의 어린이 독서 장려 사업에 아이스크림에듀 출판물이 이름을 올리며 콘텐츠 경쟁력을 인정받았다.', source: 'MTN', importance: 'positive', url: 'https://news.mtn.co.kr/news-detail/2026073114574260178', imageUrl: 'https://menu.mtn.co.kr/upload/article/2026/07/31/2026073114574260178_00_164.jpg' },
                { date: '2026-08-04', title: '"읽어도 무슨 뜻인지 몰라요"...SKT, AI로 문해력 교육 나선다', summary: '학생들의 문해력 저하 문제가 심각해지는 가운데 SK텔레콤이 AI 기술을 활용한 문해력 향상 교육 서비스를 추진한다. 통신사가 AI 교육 시장에 직접 뛰어들면서 에듀테크 생태계에 새로운 플레이어가 등장했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213461', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213461_216937_1026.jpg' },
                { date: '2026-08-04', title: '비상교육, 6~9세 영어 브랜드 \'잉글리시팝\' 론칭… 유아·초등 잇는 전환기 영어 시장 진출', summary: '비상교육이 6~9세를 대상으로 한 영어 브랜드 \'잉글리시팝\'을 론칭하며 유아에서 초등으로 이어지는 전환기 영어 교육 시장에 본격 진출했다. 기존 교육 브랜드의 연령 확장 전략이 에듀테크 시장 경쟁을 더욱 가속화하고 있다.', source: '동아에듀', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=110489', imageUrl: 'https://cdn.edu.donga.com/news/photo/202608/110489_174837_3855.jpg' },
                { date: '2026-08-04', title: '미래엔, \'제3회 우석교사상\' 시상식 및 \'2026 우석교사 페스티벌\' 성료', summary: '교육 출판 기업 미래엔이 주관하는 \'제3회 우석교사상\' 시상식과 \'2026 우석교사 페스티벌\'이 성황리에 마무리됐다. 혁신적인 수업을 실천하는 교사들을 발굴하고 격려하는 자리로 교육 현장의 호응을 얻었다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003452980?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/07/31/0003452980_001_20260731095412357.jpg?type=w800' },
                { date: '2026-08-04', title: '웅진씽크빅, \'K-뉴딜 아카데미\' 교육생 모집', summary: '웅진씽크빅이 정부 디지털 뉴딜 정책과 연계한 \'K-뉴딜 아카데미\' 교육생을 모집한다. AI·디지털 분야 직업 교육을 통해 취업 연계까지 지원하는 성인 대상 재교육 프로그램이다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003452605?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/07/30/0003452605_001_20260730124216244.jpg?type=w800' },
                { date: '2026-08-05', title: '테크빌교육, 업스테이지와 교육 AI 협력…학교 맞춤형 서비스 개발 추진', summary: '테크빌교육이 AI 기업 업스테이지와 협력해 학교 현장에 최적화된 교육 AI 서비스 개발에 나선다. 에듀테크 기업과 AI 기술 기업 간 협업을 통해 실제 교육 현장에 적용 가능한 맞춤형 솔루션을 구축한다는 목표다.', source: '매일일보', importance: 'positive', url: 'https://www.m-i.kr/news/articleView.html?idxno=1398833', imageUrl: 'https://cdn.m-i.kr/news/thumbnail/202608/1398833_1186669_3254_v150.jpg' },
                { date: '2026-08-05', title: '에듀프레임, AI 판서 프로그램 2종 조달 등록', summary: '에듀프레임의 AI 기반 판서 프로그램 2종이 공공기관 조달 목록에 등록됐다. 학교 현장에서 교사들이 공공 구매를 통해 AI 판서 솔루션을 더 쉽게 도입할 수 있는 길이 열렸다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003453903?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/04/0003453903_001_20260804194215543.png?type=w800' },
                { date: '2026-08-05', title: '비상교육, 역사인식·사회적 책임 강화 위한 전문가 초빙 강연 운영', summary: '비상교육이 임직원들의 역사 인식과 사회적 책임 의식 강화를 위해 외부 전문가를 초빙해 강연 프로그램을 운영한다. 교육 기업으로서의 사회적 역할과 책무에 대한 내부 역량을 키우기 위한 취지다.', source: '동아에듀', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=110532', imageUrl: 'https://cdn.edu.donga.com/news/photo/202608/110532_174882_043.jpg' },
                { date: '2026-08-05', title: '"토종 데이터센터로 K-AI 경쟁력↑"…엘리스그룹, 국책사업 선정', summary: '엘리스그룹이 국내 자체 데이터센터를 기반으로 K-AI 경쟁력을 높이는 국책사업에 선정됐다. 해외 클라우드 의존도를 낮추고 국내 AI 인프라를 강화하는 디지털 주권 확보 전략의 일환이다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005395538?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/08/04/0005395538_001_20260804163010626.jpg?type=w800' },
                { date: '2026-08-06', title: '독일디자인위원회, 비상교육 본사 방문… 교육 콘텐츠 디자인 글로벌 경쟁력 확인', summary: '독일디자인위원회가 비상교육 본사를 방문해 교육 콘텐츠 디자인의 글로벌 경쟁력을 직접 확인했다. 국제 디자인 권위 기관의 관심을 받을 만큼 비상교육의 교육 콘텐츠 디자인 수준이 세계적으로 인정받고 있다는 의미다.', source: '동아에듀', importance: 'positive', url: 'https://edu.donga.com/news/articleView.html?idxno=110595', imageUrl: 'https://cdn.edu.donga.com/news/photo/202608/110595_174943_2827.jpg' },
                { date: '2026-08-06', title: '천재교과서, 중고등 교과별 수업 사례 나눔 연수 본격 운영...미래형 교수·학습 모델 공유', summary: '천재교과서가 중·고등학교 교과별 수업 사례를 공유하는 나눔 연수를 본격 운영한다. 미래형 교수·학습 모델을 현장 교사들과 나누며 교육 혁신을 선도하는 에듀테크 기업으로서의 역할을 강화하고 있다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003454444?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/05/0003454444_001_20260805141913862.jpg?type=w800' },
                { date: '2026-08-06', title: '미래엔 \'안경낀두더지\', 두 번째 신간 \'천국에서의 생활은 어떻습니까 1\' 출간', summary: '미래엔의 웹툰·출판 브랜드 \'안경낀두더지\'가 두 번째 신간 \'천국에서의 생활은 어떻습니까 1\'을 출간했다. 교육 출판에 그치지 않고 일반 도서 시장으로 콘텐츠 영역을 넓히는 미래엔의 브랜드 다각화 전략의 일환이다.', source: '전자신문', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/030/0003454595?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/08/05/0003454595_001_20260805172113122.jpg?type=w800' },

                { date: '2026-06-08', title: '[6월5일] 테드 창이 \'AI 의식\'과 앤트로픽을 비판한 이유..."문제는 인간의 착각"', summary: 'SF 작가 테드 창은 LLM이 의식을 갖고 있다는 주장은 마이크로소프트 워드가 의식이 있다는 것과 다름없다며 AI 의식론을 정면 반박했다. 앤트로픽이 AI를 의인화하는 방식을 비판하며 인간이 기술에 주관적 경험을 투영하는 착각이 진짜 문제라고 지적했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211374', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211374_214306_3155.png' },

                { date: '2026-06-11', title: '앤트로픽 "AI모델에 안전성 시험 의무화해야…일자리 대책 필요"', summary: '앤트로픽이 AI 모델 출시 전 안전성 시험을 의무화해야 한다고 주장하며 AI로 인한 일자리 변화에 대한 사회적 대책 마련의 필요성을 강조했다. AI 산업의 자율 규제를 넘어선 제도적 안전장치 도입을 촉구했다.', source: '연합뉴스', importance: 'important', url: 'https://n.news.naver.com/mnews/article/001/0016132092?sid=104', imageUrl: 'https://imgnews.pstatic.net/image/001/2026/06/11/PAP20260611032301009_P4_20260611080513611.jpg?type=w800' },

                { date: '2026-06-11', title: '구글, 동시통역 모델 \'제미나이 3.5 라이브 트랜슬레이트\' 공개…70개 언어 실시간 지원', summary: '구글이 70개 언어를 실시간으로 동시통역하는 \'제미나이 3.5 라이브 트랜슬레이트\' 모델을 공개했다. 언어 장벽 없는 글로벌 소통을 지원하는 AI 번역 기술의 새로운 이정표로 평가된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211542', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211542_214525_357.png' },
                { date: '2026-06-11', title: '애플이 내놓은 \'시리 AI\'... 아이폰 사용자 13억명에겐 그림의 떡?', summary: '애플이 새롭게 공개한 \'시리 AI\'가 일부 기기와 지역에 한정 적용되면서 전 세계 13억 아이폰 사용자 대다수는 당장 혜택을 받기 어렵다는 지적이 나온다. 단계적 출시 전략에 대한 사용자들의 아쉬움이 제기되고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003981239?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/06/10/0003981239_001_20260610162413077.jpg?type=w800' },
                { date: '2026-06-12', title: '[6월11일] \'미소스\'에 이어 \'페이블\'까지...AI 모델 이름에 숨은 의미', summary: '앤트로픽이 잇따라 내놓은 \'미소스\', \'페이블\' 등 AI 모델명에 담긴 의미와 작명 전략을 분석했다. 기술 브랜딩을 통해 AI 모델의 정체성과 메시지를 전달하려는 빅테크의 의도가 드러난다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211607', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211607_214599_4739.png' },
                { date: '2026-06-12', title: 'AI 전쟁 2라운드, 빅테크의 오픈소스 총공세 [정원훈의 AI 트렌드]', summary: '빅테크 기업들이 폐쇄형 모델 경쟁을 넘어 오픈소스 AI 모델을 대거 공개하며 새로운 경쟁 국면에 진입했다. 오픈소스 전략을 통한 생태계 선점 경쟁이 AI 산업의 핵심 화두로 떠오르고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092163722', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092163722_445058_21_v150.jpg' },
                { date: '2026-06-12', title: '구글, 확산 기술 기반 LLM \'디퓨전젬마\' 공개…"텍스트 생성 4배 빨라"', summary: '구글이 이미지 생성에 쓰이는 확산(diffusion) 기술을 언어모델에 적용한 \'디퓨전젬마\'를 공개했다. 기존 방식보다 텍스트 생성 속도를 4배 높인 새로운 LLM 아키텍처로 주목받고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211608', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211608_214602_1641.png' },
                { date: '2026-06-12', title: '알트먼, 다음 주 방한...삼성·카카오·네이버 연쇄 회동', summary: '샘 알트먼 오픈AI CEO가 다음 주 방한해 삼성·카카오·네이버 등 국내 주요 기업과 잇따라 회동할 예정이다. 한국 기업들과의 AI 협력 확대 논의가 본격화될 전망이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211605', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211605_214595_52.jpg' },
                { date: '2026-06-12', title: '네이버, \'AI 3대장\'과 모두 만난다…오픈AI·앤트로픽과도 회동', summary: '네이버가 오픈AI·앤트로픽·구글 등 AI 3대장 기업과 모두 회동을 진행하며 글로벌 AI 협력 네트워크를 확대한다. 자체 AI 경쟁력 강화와 글로벌 파트너십 다변화를 동시에 추진하는 행보다.', source: '아주경제', importance: 'important', url: 'https://www.ajunews.com/view/20260611173146138', imageUrl: 'https://image.ajunews.com/content/image/2026/06/11/20260611174349112043.jpeg' },
                { date: '2026-06-12', title: '"의미 있는 성능 개선"…오픈AI \'GPT-5.6\' 출시 카운트다운', summary: '오픈AI가 차세대 모델 \'GPT-5.6\' 출시를 앞두고 의미 있는 성능 개선을 예고했다. 경쟁사들의 잇따른 신모델 출시 속에서 오픈AI의 다음 행보에 업계의 관심이 모인다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211618', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211618_214618_4337.jpg' },
                { date: '2026-06-12', title: '앤트로픽, \'페이블 5\' 과도한 보안 차단·성능 제한 논란..."AI 연구도 제한"', summary: '앤트로픽의 신모델 \'페이블 5\'가 과도한 보안 차단과 성능 제한으로 일부 AI 연구 활동까지 제약한다는 논란이 제기됐다. 안전성과 활용성 사이의 균형에 대한 논의가 다시 불거지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211603', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211603_214594_2941.png' },
                { date: '2026-06-12', title: '[단독] 클로이드 100대 투입… 국내 첫 \'로봇 훈련소\' 연다', summary: '클로이드 로봇 100대를 투입한 국내 최초의 \'로봇 훈련소\'가 문을 연다. 피지컬 AI 로봇의 실전 데이터 학습과 검증을 위한 전용 인프라 구축이 본격화되고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003981629?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/06/12/0003981629_001_20260612050121877.jpg?type=w800' },
                { date: '2026-06-15', title: '질문하는 자가 살아남는다…AI 시대, 인문학의 쓸모에 관하여', summary: 'AI 시대에는 정답을 찾기보다 좋은 질문을 던지는 능력이 중요해지면서 인문학적 사고의 가치가 재조명되고 있다. 기술 발전 속에서 인간 고유의 사고력과 통찰력의 의미를 되짚는다.', source: '주간경향', importance: 'important', url: 'https://n.news.naver.com/mnews/article/033/0000051074?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/033/2026/06/15/0000051074_001_20260615060414655.png?type=w800' },
                { date: '2026-06-15', title: 'AI도 허가받아야 쓴다⋯미토스 수출 통제에 \'소버린 AI\' 부각', summary: '미국의 AI 모델 미토스에 대한 수출 통제 조치로 자국 기술로 AI를 구축하는 \'소버린 AI\'에 대한 관심이 커지고 있다. AI 기술 패권 경쟁 속에서 기술 자주권 확보의 중요성이 부각되고 있다.', source: '이투데이', importance: 'important', url: 'https://www.etoday.co.kr/news/view/2593352', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/06/20260614164827_2345768_1200_547.jpg' },
                { date: '2026-06-15', title: '"1인 1 AI 에이전트로 AX 전속력 돌입할 때"', summary: '직원 한 명이 한 개의 AI 에이전트를 활용하는 \'1인 1 AI 에이전트\' 체제가 기업의 AI 전환(AX) 가속화의 핵심으로 제시됐다. 업무 전반에 AI 에이전트를 전면 도입해야 한다는 산업계의 목소리가 커지고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003981966?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/06/15/0003981966_001_20260615003307401.jpg?type=w800' },
                { date: '2026-06-15', title: '샤오미, 오픈소스 코딩 에이전트 \'미모 코드\' 공개…"장기 작업서 클로드 코드 능가"', summary: '샤오미가 오픈소스 코딩 에이전트 \'미모 코드\'를 공개하며 장기 작업 처리 성능에서 클로드 코드를 능가한다고 밝혔다. 중국 빅테크의 오픈소스 AI 코딩 도구 경쟁이 한층 치열해지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211687', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211687_214727_4722.jpeg' },
                { date: '2026-06-15', title: '구글, 자연어-SQL 변환 기술 \'제미나이-SQL2\' 공개..."정확도 80% 돌파"', summary: '구글이 자연어를 SQL로 변환하는 신기술 \'제미나이-SQL2\'를 공개하며 정확도 80%를 돌파했다고 밝혔다. 데이터 분석 접근성을 높이는 자연어 기반 쿼리 기술의 발전을 보여준다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211690', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211690_214731_2317.jpg' },
                { date: '2026-06-15', title: 'AI 톱10, 美·中이 5개씩 장악… 한국 3강 꼽히지만 성능 격차 커', summary: '글로벌 AI 모델 톱10을 미국과 중국이 각각 5개씩 차지하며 양강 체제를 구축한 가운데 한국은 3강으로 꼽히지만 성능 격차가 크다는 평가가 나왔다. AI 경쟁력 강화를 위한 국가적 투자와 전략 마련이 시급하다는 지적이다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003982018?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/06/15/0003982018_001_20260615005310969.jpg?type=w800' },
                { date: '2026-06-16', title: 'GPU 확보 다음은 \'통합 제어\'… AI 인프라 운영 수요 커진다 [AI 플랫폼①]', summary: 'AI 인프라 경쟁이 GPU 확보를 넘어 분산된 컴퓨팅 자원을 통합 제어하는 운영 플랫폼으로 이동하고 있다. 효율적인 AI 인프라 운영을 위한 통합 관리 솔루션 수요가 빠르게 커지고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092163900', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092163900_445302_334_v150.jpg' },
                { date: '2026-06-16', title: '"월 200불로 1만4000불 토큰 제공"…챗GPT·클로드 \'구독료\' 실체', summary: '월 200달러의 챗GPT·클로드 구독료가 실제로는 수만 달러 상당의 토큰 사용량을 제공하는 것으로 분석됐다. AI 기업들의 구독 요금 체계와 실제 비용 구조 간의 격차가 새롭게 조명되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211728', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211728_214788_89.jpg' },
                { date: '2026-06-16', title: '"클로드 코드·코덱스를 하나로"…데이터브릭스, 에이전트 통합 플랫폼 공개', summary: '데이터브릭스가 클로드 코드와 코덱스 등 여러 AI 코딩 에이전트를 하나로 통합한 플랫폼을 공개했다. 분산된 AI 코딩 도구를 단일 환경에서 활용할 수 있는 통합 전략이 업계의 주목을 받고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211742', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211742_214812_715.png' },
                { date: '2026-06-16', title: '[6월15일] 소버린 AI가 아니라 \'첨단 모델 접근권\'이 냉정한 현실', summary: '자국 기술로 AI를 구축하는 소버린 AI보다 첨단 AI 모델에 대한 접근권 확보가 더 현실적인 과제라는 분석이 나왔다. AI 주권 논의에서 기술 자립보다 실질적 활용 권한 확보가 우선이라는 시각을 제시한다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211727', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211727_214786_2811.png' },
                { date: '2026-06-17', title: '"AI 에이전트 포털 시대 열겠다"… 업스테이지 컴퍼니 출범', summary: '업스테이지가 AI 에이전트 포털 시대를 열겠다며 새로운 컴퍼니를 출범했다. AI 에이전트 기반 B2B 서비스 플랫폼 구축을 통해 기업용 AI 시장 공략에 나선다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092163966', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092163966_445361_175_v150.jpg' },
                { date: '2026-06-17', title: '"먼저 퇴근하세요" 사번 받아 일하는 AI···활용 도구에서 동료로 승진하는 \'AI\'', summary: '기업들이 AI에 사번을 부여하고 실제 업무를 맡기는 형태로 활용 수준이 진화하고 있다. 단순 도구에서 업무 동료 수준으로 격상되는 AI의 역할 변화가 조직 문화에 영향을 미치기 시작했다.', source: '경향신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/032/0003452354?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/032/2026/06/16/0003452354_001_20260616185510740.jpg?type=w800' },
                { date: '2026-06-17', title: '이정헌 넥슨 대표 "AI는 도구일 뿐… 차이는 이용자 공감에서 나와"', summary: '이정헌 넥슨 대표가 AI는 도구에 불과하며 서비스의 진정한 경쟁력은 이용자와의 공감에서 나온다고 강조했다. 기술보다 사람 중심의 서비스 철학을 피력했다.', source: '경향신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001172228?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/06/16/0001172228_001_20260616155808601.jpg?type=w800' },
                { date: '2026-06-17', title: 'AI 많이 쓰기보다 잘 쓰기… \'토크노믹스\' 뜬다', summary: 'AI를 많이 사용하기보다 효율적으로 활용하는 \'토크노믹스\' 개념이 주목받고 있다. 토큰 사용량과 비용 최적화를 고려한 AI 운영 전략이 기업의 새로운 경쟁력으로 떠오르고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003982382?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/06/17/0003982382_001_20260617003521149.jpg?type=w800' },
                { date: '2026-06-17', title: '美 앤트로픽 통제에 소버린 AI 부상', summary: '미국 앤트로픽의 AI 모델 통제 강화로 자국 AI 기술 주권을 확보하려는 소버린 AI 움직임이 확산되고 있다. 글로벌 AI 규제 환경 변화가 각국의 독자적 AI 역량 구축을 촉진하고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092164007', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092164007_445439_4446_v150.jpg' },
                { date: '2026-06-17', title: '[6월16일] 나델라가 경고한 \'AI 공동화\'…"AI는 소수 모델이 아닌 모든 기업의 문제"', summary: '마이크로소프트 사티아 나델라 CEO가 AI가 일부 모델에 집중되는 \'공동화\' 위험을 경고하며 AI는 소수 모델이 아닌 모든 기업의 과제라고 강조했다. AI 시대 기업의 자체 역량 구축 중요성이 다시 부각됐다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211764', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211764_214831_531.png' },
                { date: '2026-06-17', title: '사카나 AI, \'가상 CSO\' 에이전트 출시…8시간 조사로 100페이지 보고서 작성', summary: '사카나 AI가 8시간 조사만으로 100페이지 보고서를 작성하는 \'가상 CSO\' AI 에이전트를 출시했다. 전략적 의사결정 지원 영역에 AI 에이전트가 진입하며 고위 직책 수준의 업무를 수행하는 단계에 이르렀다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211790', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211790_214864_552.jpeg' },
                { date: '2026-06-19', title: '[6월17일] 앤트로픽을 둘러싼 미국의 달라진 시선..."AI 안전론의 역설"', summary: '앤트로픽의 AI 안전 중심 전략에 대한 미국 내 시선이 달라지고 있다는 분석이다. AI 안전을 강조할수록 오히려 기술 패권 경쟁에서 뒤처질 수 있다는 역설적 상황이 조명되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211815', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211815_214895_520.png' },
                { date: '2026-06-19', title: '[6월18일] 반도체 다음은 AI 모델...G7서 떠오른 \'접근권 외교\'', summary: 'G7 정상회의에서 반도체에 이어 AI 모델의 접근권이 새로운 외교 이슈로 부상했다. 첨단 AI 모델에 대한 국가 간 접근권 확보가 기술 외교의 핵심 의제로 떠오르고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211859', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211859_214953_259.png' },
                { date: '2026-06-19', title: '3B 모델로 \'제미나이 3 프로\' 수학 실력 능가..웨이보, 벤치마크 논쟁 촉발', summary: '30억 파라미터 규모의 소형 모델이 구글 제미나이 3 프로의 수학 벤치마크를 능가했다는 웨이보의 주장이 벤치마크 신뢰성 논쟁을 촉발했다. 소형 모델의 특화 성능과 벤치마크 평가 방식에 대한 업계 논의가 활발해지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211862', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211862_214962_5920.jpg' },
                { date: '2026-06-19', title: '\'챗GPT\' 독주 흔들…글로벌 점유율 사상 첫 50% 아래로', summary: '챗GPT의 글로벌 AI 챗봇 시장 점유율이 사상 처음으로 50% 아래로 떨어졌다. 클로드·제미나이 등 경쟁 서비스의 성장으로 AI 챗봇 시장의 다변화가 가속화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211810', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211810_214891_048.jpg' },
                { date: '2026-06-19', title: '오픈소스가 GPT를 추월했다 [정원훈의 AI 트렌드]', summary: '오픈소스 AI 모델이 GPT 시리즈를 추월하는 성과를 내며 AI 생태계의 판도가 바뀌고 있다. 폐쇄형 모델 중심의 경쟁 구도가 오픈소스 모델의 약진으로 재편되는 흐름이다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092164185', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092164185_445664_2941_v150.jpg' },
                { date: '2026-06-19', title: '앤트로픽, 챗GPT 이어 미스트랄까지…글로벌 AI 각축장 된 한국', summary: '앤트로픽에 이어 미스트랄까지 한국 시장에 진출하면서 글로벌 AI 기업들의 한국 시장 경쟁이 격화되고 있다. 한국이 글로벌 AI 기업들의 주요 각축장으로 부상하고 있다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005374165?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/06/19/0005374165_001_20260619045111862.jpg?type=w800' },
                { date: '2026-06-19', title: '앤트로픽, \'클로드 디자인\' 업그레이드...기업용 플랫폼으로 진화', summary: '앤트로픽이 클로드 디자인을 업그레이드하며 기업용 플랫폼으로의 진화를 본격화했다. UI/UX 개선과 기업 맞춤 기능 강화를 통해 B2B AI 서비스 경쟁력을 높이고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211857', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211857_214952_545.png' },
                { date: '2026-06-19', title: '앤트로픽 "코딩 몰라도 업무 전문가라면 개발자 못지않게 AI 잘 쓴다"', summary: '앤트로픽이 코딩 지식이 없어도 업무 전문성만으로 AI를 효과적으로 활용할 수 있다고 밝혔다. 비개발 직군의 AI 활용 가능성을 강조하며 AI 도구의 접근성 확대를 시사했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211874', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211874_214974_624.png' },

                { date: '2026-06-22', title: '오픈AI, 이번 주 \'GPT-5.6\' 출시 전망…앤트로픽 규제 틈타나', summary: '오픈AI가 이번 주 차세대 모델 \'GPT-5.6\' 출시를 앞두고 있다는 전망이 나왔다. 앤트로픽의 규제 이슈 속에서 경쟁 우위를 확보하려는 전략적 타이밍으로 분석된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211949', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211949_215077_459.jpg' },
                { date: '2026-06-22', title: '오픈AI, 스스로 가설 세우고 실험·검증하는 \'AI 화학자\' 프로젝트 공개', summary: '오픈AI가 스스로 가설을 세우고 실험·검증하는 자율적 \'AI 화학자\' 프로젝트를 공개했다. AI가 과학 연구의 전 과정을 자율 수행하는 단계로 진입하고 있음을 보여준다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211903', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211903_215015_1744.png' },
                { date: '2026-06-22', title: '팔란티어·오픈AI·엔비디아, \'넥스트라이즈 2026\' 한자리에···글로벌 기업이 한국으로 향하는 까닭', summary: '팔란티어·오픈AI·엔비디아 등 글로벌 AI 기업들이 \'넥스트라이즈 2026\'에 한자리에 모인다. 한국이 글로벌 AI 기업들의 아시아 핵심 거점으로 부상하고 있음을 보여주는 행보다.', source: 'IT동아', importance: 'important', url: 'https://it.donga.com/109049/', imageUrl: 'https://it.donga.com/media/__sized__/images/2026/6/18/e0d627a561584473-thumbnail-960x540-70.jpg' },
                { date: '2026-06-22', title: '구글이 4조 들여 붙잡은 \'트랜스포머\' 인재…2년 안 돼 오픈AI로 갔다', summary: '구글이 4조원을 들여 영입한 트랜스포머 핵심 인재가 2년도 안 돼 오픈AI로 이직했다. AI 인재를 둘러싼 빅테크 간 경쟁이 그만큼 치열하다는 것을 보여주는 사례다.', source: '뉴시스', importance: 'important', url: 'https://n.news.naver.com/mnews/article/003/0014018470?sid=104', imageUrl: 'https://imgnews.pstatic.net/image/003/2026/06/21/NISI20240926_0001662650_web_20240926132529_20260621130123015.jpg?type=w800' },
                { date: '2026-06-22', title: '네이버 \'AI탭\' 효과 톡톡 … 검색 점유율 66%로 쑥', summary: '네이버가 도입한 \'AI탭\' 기능이 효과를 발휘하며 검색 점유율이 66%까지 상승했다. AI 기반 검색 서비스 혁신이 플랫폼 경쟁력 강화로 직결되는 양상이다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005696693?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/06/21/0005696693_001_20260621173907767.jpg?type=w800' },
                { date: '2026-06-23', title: '[6월22일] "내 치즈를 옮긴 것은 챗GPT"… 종이책에서 AI로 이동하는 \'조언 산업\'', summary: '자기계발서·상담 등 \'조언 산업\'이 종이책에서 AI 챗봇으로 빠르게 이동하고 있다는 분석이다. 챗GPT가 개인 맞춤형 조언을 제공하면서 기존 출판·상담 시장의 구조적 변화가 가속화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211972', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211972_215106_612.png' },
                { date: '2026-06-23', title: '앤트로픽 "클로드 오퍼스 4.7, 인간보다 37배 빠르게 로봇 제어 수행"', summary: '앤트로픽이 클로드 오퍼스 4.7 모델이 로봇 제어 작업에서 인간보다 37배 빠른 속도를 보였다고 밝혔다. AI 모델의 피지컬 AI 영역 확장과 실시간 로봇 제어 성능이 주목받고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211969', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211969_215143_581.png' },
                { date: '2026-06-23', title: '엔비디아, 재학습 없는 공간 추론 AI \'스페이셜클로\' 공개…"코드가 행동 인터페이스"', summary: '엔비디아가 별도의 재학습 없이 공간 추론이 가능한 AI \'스페이셜클로\'를 공개했다. 코드를 행동 인터페이스로 활용하는 새로운 접근법으로 로봇·AR 등 공간 AI 분야의 혁신을 이끌 전망이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=211981', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/211981_215123_540.png' },
                { date: '2026-06-23', title: '광고판 넘어 대행사 역할까지…네이버, AI 브리핑 수익화 \'시동\'', summary: '네이버가 AI 브리핑 기능을 광고 매체를 넘어 대행사 역할까지 확장하며 수익화에 시동을 걸었다. AI 기반 콘텐츠 추천과 광고의 결합이 디지털 광고 시장에 새로운 수익 모델을 만들어가고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092164339', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202606/2023092164339_445866_4946_v150.jpg' },
                { date: '2026-06-24', title: '[6월23일] "토큰 아끼지 마라"...새로운 AI 경쟁력은 \'추론 투자\'', summary: '토큰 사용을 아끼기보다 충분한 추론에 투자하는 것이 새로운 AI 경쟁력이라는 분석이 나왔다. 비용 절감보다 추론 품질 향상에 집중하는 전략이 AI 활용의 차별화 요소로 부상하고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212009', imageUrl: 'https://cdn.aitimes.com/news/photo/202606/212009_215161_657.png' },

                { date: '2026-07-02', title: '[7월1일] "AI 시대 최대 리스크는 기술이 아닌 불평등"…다시 거론된 \'엥겔스의 정체\'', summary: '경제학자 라이언 에이번트가 AI 시대 최대 리스크는 기술이 아닌 불평등으로 인한 사회적 반발이라고 경고했다. AI 이익이 자본 소유자에게 집중되면 19세기 산업혁명의 \'엥겔스의 정체\'가 반복될 수 있다는 분석이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212308', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212308_215516_3311.png' },
