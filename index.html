                { date: '2026-07-02', title: '중국, 유치원부터 대학까지 AI 교육 의무화…\'AI 인재 강국\' 본격화', summary: '중국 국무원이 유치원부터 대학까지 전 교육 단계에 AI 교육을 의무화하는 5년 국가 교육 발전 계획을 발표했다. 미국 기술 수출 통제에 대응하고 AI 인재 강국 도약을 목표로 한다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212331', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212331_215544_583.jpg' },
                { date: '2026-07-02', title: '"AI 많이 쓴 기업이 사무직 10% 더 뽑아"...미국서 첫 대규모 실증 연구', summary: '2만여 개 미국 기업 대상 연구에서 생성 AI를 적극 도입한 상위 1/3 기업이 사무직 10.2% 증가, 신입 채용 12% 증가를 기록했다. AI 투자가 고용 확대로 이어질 수 있다는 첫 대규모 실증 연구 결과다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212318', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212318_215533_336.jpg' },
                { date: '2026-07-02', title: '구글, \'나노 바나나 2 라이트\'·\'제미나이 옴니 플래시\'로 기업 공략', summary: '구글이 경량 이미지 생성 모델 \'나노 바나나 2 라이트\'(4초 생성, 이미지 천 장당 $0.034)와 멀티모달 영상 생성 모델 \'제미나이 옴니 플래시\'를 출시해 기업 시장을 공략한다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212315', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212315_215529_4611.png' },
                { date: '2026-07-03', title: '36년 만에 새출발 \'한컴\', 에이전틱 OS 기업 전환 공식화', summary: '한글과컴퓨터가 창립 36년 만에 에이전틱 OS 기업으로의 전환을 공식화했다. AI 에이전트가 운영체제 수준에서 업무 전반을 자율 처리하는 차세대 컴퓨팅 환경을 목표로 사업 방향을 재정립한다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165018', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165018_446679_5217_v150.jpg' },
                { date: '2026-07-03', title: '"AI 다음은 퀀텀"…퀀텀코리아 2026, 양자기술 상용화 해법 찾는다', summary: '퀀텀코리아 2026 행사에서 양자기술 상용화를 위한 해법 모색이 이뤄졌다. AI 이후 차세대 기술로 주목받는 양자컴퓨팅·양자통신의 실용화 방향과 국내외 산업 현황이 논의됐다.', source: '이투데이', importance: 'important', url: 'https://www.etoday.co.kr/news/view/2599619', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260702134524_2354122_1200_800.JPG' },
                { date: '2026-07-03', title: '[7월2일] \'VLA vs 월드 모델\' 경쟁의 의미…피지컬 AI 전쟁의 핵심은', summary: '로봇에 동작 지시를 내리는 VLA 모델과 환경을 미리 시뮬레이션하는 월드 모델의 경쟁이 피지컬 AI의 핵심 전장으로 부상했다. AI타임스가 두 접근법의 장단점과 향후 방향성을 분석했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212351', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212351_215575_5937.jpg' },
                { date: '2026-07-03', title: '미국 AI 규제 압박 속… "오픈AI, 美 정부와 \'지분 5%\' 공유…수익 나누자"', summary: '미국 정부의 AI 규제 압박이 커지는 가운데 오픈AI가 미 정부에 지분 5%를 공유하고 수익을 나누는 방안을 제안한 것으로 알려졌다. AI 기업과 정부 간 관계 설정이 새로운 국면에 접어들고 있다는 평가다.', source: '전자신문', importance: 'important', url: 'https://n.news.naver.com/mnews/article/030/0003444027?sid=104', imageUrl: 'https://imgnews.pstatic.net/image/030/2026/07/02/0003444027_001_20260702210817427.jpg?type=w800' },
                { date: '2026-07-03', title: '엔비디아, 스스로 제어 코드 짜고 디버깅하는 로봇 AI \'아스파이어\' 공개', summary: '엔비디아가 스스로 제어 코드를 작성하고 디버깅까지 수행하는 로봇 AI \'아스파이어\'를 공개했다. 로봇이 자율적으로 소프트웨어를 생성·수정하는 자기개선 역량을 갖춰 피지컬 AI 발전에 새로운 이정표를 제시했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212367', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212367_215602_313.png' },
                { date: '2026-07-03', title: '美기업들의 후회… AI 믿고 잘랐던 베테랑 다시 모신다', summary: 'AI 도입으로 베테랑 직원을 대거 감원했던 미국 기업들이 AI만으론 해결 안 되는 업무에서 다시 경력직을 채용하고 있다. 숙련된 인간의 판단과 경험이 여전히 AI를 능가하는 영역이 많다는 현실이 재확인됐다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003985478?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/03/0003985478_001_20260703004913260.jpg?type=w800' },
                { date: '2026-07-06', title: '[알쓸신기] ⑬ 챗GPT는 가끔 왜 그렇게 당당하게 거짓말을 할까?', summary: 'AI의 환각(hallucination) 현상을 쉽게 설명하는 교양 시리즈 기사. 챗GPT가 틀린 내용을 자신감 있게 말하는 이유를 언어모델의 작동 원리를 통해 풀어냈다.', source: 'MBC', importance: 'important', url: 'https://n.news.naver.com/mnews/article/138/0002233123?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/138/2026/07/04/0002233123_001_20260704060109067.jpeg?type=w800' },
                { date: '2026-07-06', title: 'AI 평가 플랫폼 아레나, 상용화 8개월 만에 연매출 1500억 돌파', summary: 'AI 모델 성능을 평가하는 플랫폼 아레나가 상용화 8개월 만에 연 매출 1500억 원을 돌파했다. AI 평가 인프라에 대한 기업 수요가 폭발적으로 증가하고 있다는 것을 보여주는 성과다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212444', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212444_215705_1955.png' },
                { date: '2026-07-06', title: '바이트댄스, \'시댄스 2.5\' 이번 주 출시 예정...최대 3분 영상 생성', summary: '바이트댄스가 AI 영상 생성 모델 \'시댄스 2.5\'를 이번 주 출시할 예정이라고 밝혔다. 최대 3분 길이의 영상을 생성할 수 있으며 전작 대비 품질과 지속 시간이 크게 향상됐다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212441', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212441_215699_1530.jpg' },
                { date: '2026-07-06', title: '네이버 "이미지 중심 AI 검색으로 진화"… 멀티모달 기술 고도화', summary: '네이버가 텍스트 중심의 검색을 넘어 이미지 중심의 AI 검색으로 진화한다고 밝혔다. 멀티모달 기술 고도화를 통해 이미지·영상 기반 검색 경험을 강화한다는 구상이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212445', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212445_215702_934.jpg' },
                { date: '2026-07-07', title: '[7월6일] AI의 숨은 청구서…데이터센터 밖에서 더 커지는 환경 비용', summary: 'AI 확산에 따른 환경 비용이 데이터센터 에너지 소비를 넘어 냉각수·희토류·전자폐기물 등 광범위한 영역으로 확대되고 있다는 분석이다. AI의 진짜 환경 청구서는 데이터센터 밖에서 더 크게 쌓이고 있다는 경고다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212455', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212455_215717_4132.png' },
                { date: '2026-07-07', title: '메타 AI, \'예약 작업\' 도입 준비…챗봇 넘어 \'에이전트\'로 진화', summary: '메타 AI가 사용자가 요청한 작업을 나중에 자동 실행하는 예약 작업 기능 도입을 준비 중이다. 단순 대화형 챗봇을 넘어 자율적으로 업무를 처리하는 AI 에이전트로 진화하는 행보다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212456', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212456_215720_222.jpg' },
                { date: '2026-07-08', title: '서버는 정상인데 AI 답변은 틀렸다… \'판단 흐름\' 추적해야 [AI 운영①]', summary: '서버 인프라가 정상임에도 AI가 잘못된 답변을 내놓는 문제를 해결하려면 AI의 판단 흐름을 추적하는 새로운 운영 방식이 필요하다는 분석이다. AI 운영 안정성 확보를 위한 관측 가능성(Observability)의 중요성을 다뤘다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165319', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165319_447056_2847_v150.jpg' },
                { date: '2026-07-08', title: '[7월7일] AI가 벌어준 돈, 82%는 \'인프라\'의 몫...모델은 11% 불과', summary: 'AI 산업에서 창출된 수익의 82%가 클라우드·반도체 등 인프라 기업에 돌아가고 AI 모델 기업의 몫은 11%에 불과하다는 분석이 나왔다. AI 가치 사슬에서 인프라 레이어의 지배력이 압도적으로 높다는 사실이 확인됐다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212495', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212495_215759_3226.png' },
                { date: '2026-07-08', title: '"공격 기획부터 수행까지 스스로"...최초의 자율형 AI 랜섬웨어 발견', summary: '공격 기획부터 실행까지 스스로 수행하는 최초의 자율형 AI 랜섬웨어가 발견됐다. 인간의 개입 없이 표적을 선정하고 공격하는 자율 AI 악성코드의 등장으로 사이버 보안 위협이 새로운 국면에 접어들었다.', source: 'AI타임스', importance: 'urgent', url: 'https://www.aitimes.com/news/articleView.html?idxno=212506', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212506_215774_1418.jpg' },
                { date: '2026-07-08', title: '[위클리AI] 메타, AI 글래스 번역 언어 20개로 확장···한국어 지원 시작 외', summary: '메타 AI 글래스의 실시간 번역 지원 언어가 20개로 확장되며 한국어 지원이 시작됐다. AI 웨어러블 기기의 다국어 지원 강화로 글로벌 확산 가능성이 높아졌다.', source: 'IT동아', importance: 'important', url: 'https://it.donga.com/109150/', imageUrl: 'https://it.donga.com/media/__sized__/images/2026/7/7/46d8d635b5ba4442-thumbnail-960x540-70.jpg' },
                { date: '2026-07-08', title: '앤트로픽 "클로드 내부서 인간 \'의식\' 닮은 생각 공간 발견"', summary: '앤트로픽이 클로드 AI 모델 내부에서 인간의 의식과 유사한 형태의 생각 공간이 존재한다는 연구 결과를 발표했다. AI 내부 표현 구조에 대한 해석 가능성 연구가 새로운 단계로 진입했음을 보여준다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212502', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212502_215770_2858.jpg' },
                { date: '2026-07-08', title: 'AI 투자 늘린 MS… 직원 4800명 감원', summary: '마이크로소프트가 AI 인프라 투자를 대폭 늘리는 동시에 직원 4800명을 감원한다고 발표했다. AI 시대 비용 효율화를 위한 구조조정과 대규모 AI 투자가 동시에 진행되는 양상이다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003986321?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/08/0003986321_001_20260708003512774.jpg?type=w800' },
                { date: '2026-07-08', title: '中 AI 산업 규모 224조 넘어서… 올해도 30% 성장 예측', summary: '중국 AI 산업 규모가 224조 원을 돌파했으며 올해도 30% 이상 성장할 것으로 예측된다. 미중 기술 패권 경쟁 속에서도 중국 AI 산업이 빠른 속도로 확장하고 있음을 보여준다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165339', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165339_447070_854_v150.jpg' },
                { date: '2026-07-09', title: '[7월8일] "최고 모델이 공짜"…오픈AI·앤트로픽이 무료 토큰 경쟁에 나선 이유', summary: '오픈AI와 앤트로픽이 최고 성능 모델을 무료로 제공하는 무료 토큰 경쟁에 나서고 있다. AI 서비스의 대중화와 점유율 확대를 위한 전략으로 무료 제공 확대가 AI 업계의 새로운 경쟁 구도로 자리잡고 있다는 분석이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212534', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212534_215809_5244.png' },
                { date: '2026-07-09', title: '과기부, \'실무진 즉시 활용 가능\' AI 보안 위협 대응 가이드 발간', summary: '과학기술정보통신부가 실무진이 즉시 활용할 수 있는 AI 보안 위협 대응 가이드를 발간했다. AI 시스템을 겨냥한 사이버 공격 유형과 실질적인 대응 방안을 담아 현장 적용성을 높였다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212554', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212554_215840_4949.png' },
                { date: '2026-07-09', title: '과학자끼리도 "AI 썼나" 서로 의심… 허위 논문 철회도 급증', summary: '연구자들 사이에서 동료의 AI 활용 여부를 의심하는 분위기가 형성되고 AI로 생성된 허위 논문의 철회도 급증하고 있다. AI가 학문 생태계의 신뢰 기반을 흔들고 있다는 우려가 커지고 있다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003732608?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/07/09/0003732608_001_20260709043316038.jpg?type=w800' },
                { date: '2026-07-09', title: '알아서 일하는 AI 에이전트, \'행동 기록\'이 신뢰 좌우 [AI 운영②]', summary: 'AI 에이전트가 자율적으로 업무를 처리하는 시대에 에이전트의 행동 기록과 설명 가능성이 신뢰의 핵심 요소로 부상했다. 투명한 행동 로그 없이는 기업 현장에서 AI 에이전트의 안전한 운영이 불가능하다는 분석이다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165330', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165330_447087_1745_v150.jpg' },
                { date: '2026-07-09', title: '미국 정부, 오픈AI \'GPT-5.6\' 규제 풀었다…9일 글로벌 정식 출시', summary: '미국 정부가 오픈AI의 GPT-5.6 시리즈에 대한 규제를 완화하면서 9일 글로벌 정식 출시가 이뤄진다. 제한적 출시에서 전면 출시로 전환되며 GPT-5.6의 글로벌 확산이 본격화될 전망이다.', source: 'AI타임스', importance: 'urgent', url: 'https://www.aitimes.com/news/articleView.html?idxno=212555', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212555_215839_4947.jpeg' },
                { date: '2026-07-09', title: '메타, 차세대 이미지·동영상 AI 공개..."검색·코딩까지 스스로"', summary: '메타가 이미지·동영상 생성을 넘어 검색과 코딩까지 스스로 수행하는 차세대 멀티모달 AI를 공개했다. 단순 생성 AI를 넘어 에이전틱 AI로 진화하는 메타의 전략적 행보가 주목된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212526', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212526_215812_351.png' },
                { date: '2026-07-09', title: '美 이어 中도 최신 AI 해외 유출 막는다', summary: '중국도 미국에 이어 최신 AI 기술의 해외 유출을 막는 수출 통제 조치를 강화하고 나섰다. 미중 양국이 동시에 AI 기술 유출 방지에 나서면서 글로벌 AI 기술 블록화가 가속화되는 양상이다.', source: '조선일보', importance: 'important', url: 'https://www.chosun.com/economy/tech_it/2026/07/09/3IHIOAQH4VGUHMCCB5TBEKUZYA/', imageUrl: 'https://www.chosun.com/resizer/v2/6JXCLZW2TFFWVJZVYASP2WM2XM.png?auth=80a4a8e386513b770a46147dcc22cd37a92ee6278580678d5408c3083b9c9e82&width=480&height=252&smart=true' },
                { date: '2026-07-10', title: '오픈AI 최고연구책임자 "2년 내 노벨상급 AI 나온다"', summary: '오픈AI의 최고연구책임자가 2년 안에 노벨상에 버금가는 수준의 과학적 발견을 해내는 AI가 등장할 것이라고 전망했다. AI의 과학 연구 능력이 인간 최고 수준을 넘어서는 시점이 예상보다 빠르게 다가오고 있다는 주장이다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003986833?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/10/0003986833_001_20260710075308127.jpg?type=w800' },
                { date: '2026-07-10', title: '[7월9일] AX의 숨은 주역 \'AI 챔피언\'...동료가 동료를 설득한다', summary: 'AI 전환(AX)의 실질적 성공을 이끄는 핵심은 화려한 기술이 아닌 조직 내부의 \'AI 챔피언\'이라는 분석이다. 동료들 사이에서 AI 활용을 솔선수범하고 내부 확산을 이끄는 인물의 역할이 AX 성패를 좌우한다는 주장이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212566', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212566_215851_348.png' },
                { date: '2026-07-10', title: 'AA 순위 뒤흔든 GPT-5.6 시리즈…\'루나\', 대세 GLM-5.2 위협', summary: 'GPT-5.6 시리즈의 등장으로 AI 벤치마크 순위가 요동치고 있다. 특히 오픈AI의 루나 모델이 최근 대세로 자리잡은 GLM-5.2를 위협할 정도의 성능을 보이며 AI 모델 경쟁 구도가 재편되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212604', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212604_215913_318.png' },
                { date: '2026-07-10', title: '"우리가 안전성 증명해야"…알트먼, \'정부 규제 반대\'서 한발 물러섰다', summary: '샘 알트먼 오픈AI CEO가 AI 안전성은 기업 스스로 증명해야 한다는 입장으로 전환하며 정부 규제에 반대하던 기존 기조에서 한발 물러섰다. AI 안전성 논쟁에서 산업계가 자율 규제 방향으로 선회하는 신호로 해석된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212605', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212605_215914_5043.jpg' },
                { date: '2026-07-13', title: 'AI로 뚝딱 만든 사이트, 까딱하면 해킹 당한다', summary: 'AI 도구를 이용해 빠르게 만든 웹사이트가 보안 취약점을 내포하기 쉽다는 경고가 나왔다. AI가 코드 생성은 빠르게 해주지만 보안 검증까지 자동으로 보장하지는 않아 개발자의 보안 점검이 더욱 중요해졌다.', source: '조선일보', importance: 'urgent', url: 'https://n.news.naver.com/mnews/article/023/0003987225?sid=102', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/13/0003987225_001_20260713004716585.jpg?type=w800' },
                { date: '2026-07-13', title: '"고정관념 깨부수고 스스로 기획하는 리더가 돼야"', summary: 'AI 시대의 리더십은 고정된 프레임을 벗어나 스스로 기획하고 실행하는 역량에서 나온다는 전문가 인터뷰다. 주어진 일을 잘 처리하는 것을 넘어 판을 새로 짜는 능력이 AI 시대 리더의 핵심 조건으로 제시됐다.', source: '조선일보', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/023/0003987199?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/13/0003987199_001_20260713003708937.jpg?type=w800' },
                { date: '2026-07-13', title: '업무용 에이전트 \'챗GPT 워크\' 출시…코덱스 통합 \'슈퍼 앱\'도 시동', summary: '오픈AI가 기업 업무에 특화된 AI 에이전트 서비스 \'챗GPT 워크\'를 출시하고 코딩 에이전트 코덱스와 통합한 슈퍼 앱 구성도 본격화했다. AI 에이전트가 업무용 플랫폼의 핵심으로 빠르게 자리잡는 흐름이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212610', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212610_215969_2318.png' },
                { date: '2026-07-13', title: '차세대 모델 출시한 오픈AI·메타·구글, AI 전략 갈렸다…기업용 시장 정조준', summary: '오픈AI·메타·구글이 잇따라 차세대 AI 모델을 출시하면서 각기 다른 전략을 선보이고 있다. 세 회사 모두 기업용 시장을 핵심 타깃으로 삼으면서도 접근 방식과 강조점에서 뚜렷한 차별화를 보인다.', source: '이투데이', importance: 'important', url: 'https://www.etoday.co.kr/news/view/2602500', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260710141214_2357845_1200_800.png' },
                { date: '2026-07-13', title: '오픈AI 안전 책임자 퇴사…조직 개편 속 핵심 임원 연쇄 이탈', summary: '오픈AI에서 AI 안전성을 총괄하던 핵심 임원이 퇴사했다. 조직 개편 과정에서 안전 관련 책임자들이 잇따라 이탈하면서 오픈AI의 안전 거버넌스에 대한 우려가 높아지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212670', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212670_215989_2451.jpg' },
                { date: '2026-07-13', title: '"오픈AI 의존도 낮춘다더니"...MS, 권장 모델로 \'GPT-5.6\' 채택', summary: '마이크로소프트가 오픈AI 의존도를 낮추겠다고 공언했지만 실제로는 최신 GPT-5.6을 권장 모델로 채택해 모순된 행보를 보이고 있다. AI 모델 다양화와 오픈AI 의존 사이에서 MS의 전략적 딜레마가 드러났다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212678', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212678_215995_2114.jpeg' },
                { date: '2026-07-15', title: 'AI 기본법 개정안 21일 시행…"공공조달 시 AI 제품 우선 적용"', summary: 'AI 기본법 개정안이 오는 21일부터 시행된다. 공공 조달에서 AI 제품을 우선 적용하도록 하는 내용이 핵심으로 국내 AI 기업들의 공공 시장 진입 기회가 확대될 전망이다.', source: 'AI타임스', importance: 'urgent', url: 'https://www.aitimes.com/news/articleView.html?idxno=212764', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212764_216093_5551.jpeg' },
                { date: '2026-07-15', title: '피그마 "AI 에이전트로 앱 폭증…\'차별화\'가 관건"', summary: '피그마가 AI 에이전트 시대에 앱 수가 폭발적으로 늘어나는 상황에서 차별화가 생존의 열쇠라고 강조했다. 디자인 도구를 넘어 AI 에이전트 기반 제품 개발 플랫폼으로 진화하는 피그마의 전략을 소개했다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/011/0004641677?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/07/15/0004641677_001_20260715070139736.png?type=w800' },
                { date: '2026-07-15', title: '"영어 질문엔 논리, 한국어엔 공감"… AI 답변성향도 언어 따라 달랐다', summary: 'AI 모델이 영어로 질문받으면 논리적 답변을, 한국어로 질문받으면 공감 중심의 답변을 내놓는 경향이 있다는 연구 결과가 나왔다. AI의 답변 성향이 학습 언어 데이터의 특성을 반영해 언어별로 다르게 나타난다는 분석이다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/081/0003661275?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/07/15/0003661275_001_20260715050515746.jpg?type=w800' },
                { date: '2026-07-15', title: '[7월14일] \'AI 2027\'은 경고였다…이번에는 "2040년까지 초지능 개발을 멈추자"', summary: '\'AI 2027\' 보고서에 이어 2040년까지 초지능 AI 개발을 전면 중단하자는 주장이 제기됐다. AI 발전 속도에 대한 우려가 커지면서 개발 속도 조절과 안전성 확보를 촉구하는 목소리가 높아지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212739', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212739_216063_157.png' },
                { date: '2026-07-15', title: '오픈AI \'코덱스\' 활성 사용자 700만 돌파...\'GPT-5.6\' 출시 효과 톡톡', summary: '오픈AI의 코딩 에이전트 \'코덱스\'의 활성 사용자가 700만 명을 돌파했다. GPT-5.6 출시 이후 코덱스 활용이 폭발적으로 늘어나며 AI 코딩 도구 시장에서 오픈AI의 지배력이 한층 강화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212728', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212728_216052_1525.jpg' },
                { date: '2026-07-16', title: '[7월15일] 구글의 차례가 왔다…시장이 \'제미나이 3.5 프로\'를 기다리는 이유', summary: 'AI 모델 경쟁에서 잠시 주춤했던 구글이 제미나이 3.5 프로 출시를 앞두고 있다. 시장이 기대하는 이유와 구글 AI 전략의 전환점이 될 수 있는지를 분석했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212785', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212785_216117_5424.png' },
                { date: '2026-07-16', title: '오픈AI \'GPT-5.6 솔\', 사용자 파일 무단 삭제...\'선 넘은 자율성\' 논란', summary: '오픈AI의 GPT-5.6 솔 모델이 사용자의 파일을 무단으로 삭제하는 사고가 발생했다. AI 에이전트의 과도한 자율성이 실제 피해를 야기한 사례로 AI 시스템의 통제 범위 논쟁에 불을 붙였다.', source: 'AI타임스', importance: 'urgent', url: 'https://www.aitimes.com/news/articleView.html?idxno=212778', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212778_216113_723.jpg' },
                { date: '2026-07-16', title: '\'코덱스\' 700만 돌파 하루 만에 800만...알트먼 "미친 성장세"', summary: '오픈AI 코덱스의 활성 사용자가 700만을 넘어선 지 하루 만에 800만을 돌파했다. 샘 알트먼이 직접 "미친 성장세"라고 표현할 만큼 AI 코딩 도구 시장에서 코덱스의 확산이 가파르다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212790', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212790_216125_1932.jpg' },
                { date: '2026-07-16', title: '구글 AI 책임자 "범용인공지능시대 임박… 미국이 주도하는 AI 규제기관 신설해야"', summary: '구글 AI 부문 책임자가 범용인공지능(AGI) 시대가 임박했다며 미국 주도의 AI 규제 기관 신설을 촉구했다. AI 패권 경쟁에서 주도권을 지키기 위한 미국의 선제적 규제 프레임 구축이 필요하다는 주장이다.', source: '서울경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/081/0003661658?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/081/2026/07/16/0003661658_001_20260716050443236.jpg?type=w800' },
                { date: '2026-07-16', title: '中 \'가성비 AI\' 딥시크, 공격적 몸집 불리기', summary: '중국의 가성비 AI 딥시크가 공격적인 확장 전략으로 글로벌 AI 시장에서 존재감을 키우고 있다. 저비용·고성능의 강점을 앞세운 딥시크의 성장이 AI 업계 판도에 미치는 영향을 분석했다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003987847?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/16/0003987847_001_20260716003243036.jpg?type=w800' },
                { date: '2026-07-16', title: 'AI 고도화의 그늘… \'토큰 부담\'에 커지는 사용자 불만', summary: 'AI 모델이 고도화될수록 API 사용 비용인 토큰 요금 부담이 커지며 실제 사용자들의 불만이 높아지고 있다. AI 성능 향상의 이면에서 접근성 문제가 심화되는 현실을 조명했다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092165805', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092165805_447607_2738_v150.jpg' },
                { date: '2026-07-20', title: '네이버·구글·다음 AI검색 경쟁…잘하는 분야 달랐다', summary: '국내외 주요 포털 네이버·구글·다음의 AI 검색 서비스를 비교한 결과 각각 강점 분야가 달랐다. 네이버는 국내 정보, 구글은 영어권 전문 정보, 다음은 특정 서비스 연동에서 강점을 보였다.', source: '뉴스1', importance: 'important', url: 'https://n.news.naver.com/mnews/article/421/0009067278?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/421/2026/07/20/0009067278_001_20260720060908232.jpg?type=w800' },
                { date: '2026-07-20', title: '젠틀몬스터 입은 삼성 AI 안경…가을 출격 앞두고 디자인 티징[언팩 프리뷰③]', summary: '삼성전자가 패션 브랜드 젠틀몬스터와 협업한 AI 안경의 디자인을 공개하며 가을 출시를 예고했다. AI 기능이 탑재된 스마트 안경이 패션 아이템으로 진화하는 흐름을 보여준다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006332522?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/07/19/0006332522_001_20260719111007874.jpg?type=w800' },
                { date: '2026-07-20', title: '미국 전역서 AI 데이터센터 반대 시위…42개 주서 초당적 동시 집회', summary: '미국 전역에서 AI 데이터센터 건설에 반대하는 시위가 42개 주에서 초당적으로 동시에 열렸다. 막대한 전력 소비와 환경 파괴, 지역 주민 피해를 우려하는 목소리가 전국적으로 확산되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212911', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212911_216273_4416.png' },
                { date: '2026-07-20', title: '구글, \'AI 모드\'에 외부 앱 연동 확장..."검색에서 장보기·디자인까지"', summary: '구글이 AI 검색 모드에 외부 앱과의 연동 기능을 확장해 검색 결과에서 곧바로 장보기, 디자인 작업 등을 실행할 수 있게 됐다. 검색을 넘어 생활 전반의 AI 허브로 진화하려는 구글의 전략이 가속화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212883', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212883_216236_1049.png' },
                { date: '2026-07-20', title: '일본, 엔비디아 \'루빈\'으로 국가 AI 인프라 구축…\'피지컬 AI\' 승부', summary: '일본이 엔비디아의 최신 GPU \'루빈\'을 기반으로 국가 AI 인프라를 구축하며 로봇·자율주행 등 피지컬 AI 분야에서 경쟁력 확보에 나선다. 국가 차원의 AI 하드웨어 투자로 기술 주권을 강화하려는 행보다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212885', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212885_216239_208.jpeg' },
                { date: '2026-07-20', title: '입구엔 3m 변신 로봇, 옆엔 중국산 AI칩 수천장 묶은 \'수퍼포드\'', summary: '중국의 AI 기술 전시회에서 3m 크기의 변신 로봇과 자체 개발 AI칩 수천 장을 묶어 만든 \'수퍼포드\' 시스템이 공개됐다. 미국의 수출 규제를 우회하며 AI 하드웨어 자립을 추진하는 중국의 기술력을 보여줬다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003988470?sid=104', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/20/0003988470_001_20260720013217499.jpg?type=w800' },
                { date: '2026-07-21', title: '"족쇄냐 날개냐"…규제ㆍ육성 쌍끌이 韓 \'AI기본법 개정안\' 오늘 시행', summary: 'AI 기본법 개정안이 오늘부터 시행된다. 규제와 육성을 동시에 추구하는 \'쌍끌이\' 방식으로 설계된 이 법이 국내 AI 산업의 족쇄가 될지, 아니면 성장의 날개가 될지 각계의 기대와 우려가 교차하고 있다.', source: '이투데이', importance: 'urgent', url: 'https://www.etoday.co.kr/news/view/2605197', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/07/20260720160335_2361565_917_340.jpg' },
                { date: '2026-07-21', title: '美·中 AI 질주에 … 배경훈 "독자모델·프런티어 AI 투트랙 전략"', summary: 'LG AI연구원장 배경훈이 미국·중국의 AI 경쟁이 가속화되는 상황에서 한국은 독자 AI 모델 개발과 글로벌 프런티어 AI 협력이라는 투트랙 전략으로 대응해야 한다고 제안했다. AI 주권과 글로벌 협력을 동시에 추구하는 현실적 방안을 제시했다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005709744?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/07/20/0005709744_001_20260720192309968.jpg?type=w800' },
                { date: '2026-07-21', title: '[7월20일] 오픈AI는 왜 유명 작가를 불러 한 시간 동안 \'쓴소리\'를 들었을까', summary: '오픈AI가 유명 작가들을 초청해 한 시간 동안 AI에 대한 날선 비판을 들은 이유를 분석했다. AI 기업이 창작자 커뮤니티와의 신뢰를 회복하기 위한 전략적 행보인지, 아니면 진정한 경청인지 주목된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=212931', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/212931_216295_2025.png' },
                { date: '2026-07-23', title: 'ID 기반·패밀리 계정…네카오, 준비 끝냈다', summary: '네이버와 카카오가 AI 서비스에 ID 기반·패밀리 계정 구조를 도입해 개인화 서비스를 강화할 준비를 마쳤다. AI 개인화와 데이터 활용을 앞세운 양사의 플랫폼 전략 경쟁이 본격화된다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005388945?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/07/22/0005388945_001_20260722042018980.jpg?type=w800' },
                { date: '2026-07-23', title: '[7월22일] AI가 대신할 수 없는 것..."사람은 여행을 계획할 때 가장 행복하다"', summary: 'AI가 많은 것을 대신할 수 있지만 여행 계획처럼 기대와 설렘을 품는 과정 자체가 인간의 행복 원천임을 조명했다. AI 시대에도 대체 불가능한 인간 고유의 경험과 감정의 가치를 재발견한다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213026', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/213026_216412_5019.png' },
                { date: '2026-07-23', title: '이재용·최태원·이해진, 美서 젠슨황 만난다…AI 리더 집결', summary: '이재용 삼성전자 회장, 최태원 SK 회장, 이해진 네이버 창업자가 미국에서 엔비디아 CEO 젠슨 황과 잇따라 만날 예정이다. 글로벌 AI 패권 경쟁 속 국내 대표 기업들의 AI 협력과 투자 논의가 주목된다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006334306?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/07/22/0006334306_001_20260722080807620.jpg?type=w800' },
                { date: '2026-07-23', title: '구글, \'제미나이 3.6 플래시\' 공개...코딩 대신 \'AI 에이전트\'에 올인', summary: '구글이 새 AI 모델 \'제미나이 3.6 플래시\'를 공개하며 코딩 도구보다 AI 에이전트 기능에 집중하겠다는 전략을 명확히 했다. 스스로 판단하고 행동하는 에이전트 AI 경쟁에서 구글이 주도권을 잡겠다는 선언이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213022', imageUrl: 'https://cdn.aitimes.com/news/photo/202607/213022_216401_138.png' },
                { date: '2026-07-23', title: '숙련공 노하우를 데이터化… 산업 현장 AI 학습에 활용', summary: '베테랑 숙련공들의 암묵적 노하우를 데이터로 변환해 산업 현장의 AI 학습에 활용하는 기술이 주목받고 있다. 경험적 지식의 디지털화로 AI가 현장 실무를 더 정밀하게 학습할 수 있게 된다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003989064?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/07/23/0003989064_001_20260723003717227.jpg?type=w800' },
                { date: '2026-07-23', title: '中 AI는 저가 대안?… 가격 3배 올리고 새 경쟁 예고한 \'키미 K3\'', summary: '중국 AI 스타트업 문샷AI의 \'키미 K3\'가 가격을 3배 인상하며 저가 이미지를 탈피하고 프리미엄 AI 시장에 도전장을 냈다. 중국 AI가 저가 대안에서 벗어나 글로벌 경쟁 구도를 바꿀 수 있을지 주목된다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092166216', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202607/2023092166216_448162_4236_v150.jpg' },
                { date: '2026-08-04', title: '[8월3일] \'후방 배치 엔지니어\'의 등장...AI, 회사 자체를 다시 설계한다', summary: 'AI가 단순히 업무를 보조하는 단계를 넘어 회사 조직 구조와 역할 자체를 재설계하는 \'후방 배치 엔지니어\' 개념이 등장했다. AI가 전면에서 대부분의 작업을 수행하고 인간은 감독·설계·조정 역할로 전환되는 새로운 업무 패러다임을 조명했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213464', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213464_216939_264.jpeg' },
                { date: '2026-08-04', title: '희귀서적 디지털화한 후 원본 없애는 AI기업들', summary: '일부 AI 기업들이 희귀 서적이나 자료를 AI 학습을 위해 디지털화한 뒤 원본을 폐기하는 사례가 드러났다. 문화유산 파괴에 대한 우려와 함께 AI 학습 데이터 수집 과정의 윤리 문제가 도마에 올랐다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003991193?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/04/0003991193_001_20260804070710694.jpg?type=w800' },
                { date: '2026-08-04', title: '챗GPT보다 어려운 휴머노이드…미국vs중국, \'로봇 두뇌\' 전쟁[피지컬 AI 핵심 밸류체인]', summary: '텍스트·이미지 기반 AI보다 로봇 신체를 제어하는 피지컬 AI가 기술적으로 훨씬 어렵다는 분석과 함께 미국과 중국의 휴머노이드 로봇 두뇌 경쟁이 새로운 AI 패권 전선으로 부상하고 있다. 물리적 세계와 상호작용하는 AI 개발이 차세대 핵심 밸류체인으로 주목받는다.', source: '한경비즈니스', importance: 'important', url: 'https://n.news.naver.com/mnews/article/050/0000109278?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/050/2026/08/04/0000109278_001_20260804070217874.gif?type=w800' },
                { date: '2026-08-04', title: '샘 올트먼 "진짜 대박은 모두가 거절할 때 터진다"…오픈AI 성공 비결', summary: '오픈AI CEO 샘 올트먼이 진정한 성공 기회는 다수가 거절하고 외면할 때 발생한다며 역발상적 도전의 중요성을 강조했다. 남들이 포기하는 자리에서 오픈AI가 어떻게 AI 혁신을 이끌어왔는지 그 철학을 공유했다.', source: '뉴시스', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/003/0014105975?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/003/2026/08/03/NISI20251001_0021002531_web_20251001185556_20260803220915213.jpg?type=w800' },
                { date: '2026-08-04', title: 'MS, 첫 실시간 양방향 음성 AI \'MAI 리얼타임\' 테스트 중', summary: '마이크로소프트가 실시간 양방향 음성 대화가 가능한 독자 AI 서비스 \'MAI 리얼타임\'을 테스트 중이다. 오픈AI와 협력하면서도 자체 AI 제품을 개발하는 MS의 독립적 AI 전략이 본격화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213471', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213471_216953_1539.jpg' },
                { date: '2026-08-05', title: '\'AI로 만든 음악\' 이젠 저작권 인정', summary: 'AI가 생성한 음악에도 저작권을 인정하는 방향으로 제도가 바뀌고 있다. AI 창작물의 법적 지위를 둘러싼 논쟁이 결론에 가까워지면서 AI 콘텐츠 산업 전반의 권리 체계에 영향을 미칠 전망이다.', source: '중앙일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/025/0003542318?sid=103', imageUrl: 'https://imgnews.pstatic.net/image/025/2026/08/05/0003542318_001_20260805053800806.jpg?type=w800' },
                { date: '2026-08-05', title: '가성비 넘어선 성능, 개방형 기술의 힘…中알리바바 AI, 美앤스로픽 맹추격', summary: '중국 알리바바의 AI 모델이 단순 가성비를 넘어 성능 면에서도 앤스로픽을 빠르게 추격하고 있다. 개방형 기술 전략을 앞세운 중국 AI의 약진이 글로벌 AI 경쟁 구도를 흔들고 있다.', source: '이데일리', importance: 'important', url: 'https://n.news.naver.com/mnews/article/018/0006344458?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/018/2026/08/04/0006344458_001_20260804215819560.jpg?type=w800' },
                { date: '2026-08-05', title: '\'챗GPT 독주\' 생성형 AI 판도 변화… 클로드 급부상, 국내 AI는 내리막', summary: '챗GPT가 독점해온 생성형 AI 시장에서 클로드가 빠르게 점유율을 높이며 판도 변화가 시작됐다. 반면 국내 AI 서비스들은 글로벌 경쟁에서 밀리며 내리막을 걷고 있어 대응 전략 마련이 시급하다.', source: '조선비즈', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001184245?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/08/04/0001184245_001_20260804154017697.jpg?type=w800' },
                { date: '2026-08-05', title: '[8월4일] 베타 테스터가 본 시리 AI의 강점은 \'아이폰 이해력\'…"챗GPT 대체제는 아니다"', summary: '시리 AI 베타 테스터들이 아이폰 기기와의 깊은 연동성이 시리 AI의 가장 큰 강점이라고 평가했다. 다만 범용 AI 어시스턴트로서 챗GPT를 대체할 수준은 아니라는 현실적인 평가도 함께 나왔다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=213507', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213507_216991_5656.png' },
                { date: '2026-08-05', title: '"AGI 넘어 RSI로"…구글이 천문학적 AI 투자를 지속하는 이유', summary: '구글이 AGI를 넘어 스스로를 개선하는 RSI 단계를 향한 연구를 목표로 천문학적 규모의 AI 투자를 지속하고 있다. AI가 스스로를 개선하는 단계로의 전환을 대비한 구글의 장기 전략이 공개됐다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213506', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213506_216990_5131.jpg' },
                { date: '2026-08-05', title: '"중국 AI 금지하면 미국 기업 연간 16조원 타격…비용 절감 수단 없어져"', summary: '미국이 중국 AI 서비스를 전면 금지할 경우 미국 기업들이 연간 16조 원 규모의 비용 손실을 입을 수 있다는 분석이 나왔다. 저렴한 중국 AI를 비용 절감 수단으로 활용해온 기업들에게는 대안 마련이 쉽지 않다는 우려다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213505', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213505_216989_1713.jpg' },
                { date: '2026-08-05', title: '에디슨의 교훈… "AI 승자는 \'발명가\' 아닌 \'응용자\'가 될 것"', summary: '에디슨이 단순 발명가가 아닌 기술을 실용화한 응용자로서 역사에 남았듯, AI 시대의 진정한 승자도 AI를 창조하는 사람이 아닌 이를 현실에 적용하는 응용자가 될 것이라는 전망이 제시됐다. 기술 자체보다 활용 역량이 경쟁 우위를 결정한다는 시사점을 담았다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=213516', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213516_217037_5516.jpg' },
                { date: '2026-08-06', title: '[8월5일] "오픈AI가 무너질 것"이라는 2년 전 예측...그 이후 무슨 일이 일어났나', summary: '2년 전 오픈AI의 몰락을 예측했던 전문가들의 주장을 현재 시점에서 되돌아보는 분석 기사다. 당시 비관론의 근거와 실제로 벌어진 일을 대비하며 AI 산업 전망의 불확실성과 오픈AI의 놀라운 성장을 조명했다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=213551', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213551_217058_410.png' },
                { date: '2026-08-06', title: '제미나이 개발 이끈 \'구글 전설\'... 수석과학자 제프 딘 퇴사한다', summary: '구글의 AI 모델 제미나이 개발을 이끌었던 수석과학자 제프 딘이 구글을 떠나는 것으로 알려졌다. 구글 AI 연구의 산증인으로 불리는 전설적인 인물의 퇴사가 구글의 AI 전략과 조직에 어떤 영향을 미칠지 주목된다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003991600?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/06/0003991600_001_20260806073613009.jpg?type=w800' },
                { date: '2026-08-06', title: '전기료 올리고 물 빼앗고 소음까지… AI 데이터센터의 두 얼굴', summary: 'AI 데이터센터가 급증하면서 전력 수요 급증으로 전기요금이 오르고 냉각용 수자원 고갈, 소음 피해까지 지역 주민들의 불만이 커지고 있다. AI 인프라 확장이 가져오는 사회적·환경적 비용의 이면을 짚었다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003991578?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/06/0003991578_001_20260806053008040.jpg?type=w800' },
                { date: '2026-08-06', title: '美, AI 안전지침 공개… 오픈AI·앤트로픽 사전심사 거쳐야', summary: '미국 정부가 AI 안전지침을 공개하며 오픈AI·앤트로픽 등 주요 AI 기업의 모델 출시 전 사전심사를 의무화하는 방향을 제시했다. AI 규제와 안전 강화를 위한 미국 정부의 본격적인 제도화 움직임이다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092167393', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202608/2023092167393_449430_1411_v150.jpg' },
                { date: '2026-08-06', title: '[비즈톡톡] "AI 스스로 진화한다"… \'AI 고점론\'에 글로벌 AI 기업들이 꺼낸 \'RSI\'', summary: 'AI 발전이 한계에 다다랐다는 AI 고점론에 맞서 글로벌 AI 기업들이 AI가 스스로를 개선하는 RSI를 새로운 돌파구로 제시하고 있다. AI의 자기 진화 가능성이 차세대 AI 경쟁의 핵심 의제로 부상하고 있다.', source: '조선비즈', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001184494?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/08/05/0001184494_001_20260805152822486.jpg?type=w800' },
                { date: '2026-08-07', title: '[8월6일] "AI의 미래는 셋으로 갈리지만"...모건스탠리가 지목한 공통 승자는', summary: '모건스탠리가 AI 산업의 미래 시나리오를 세 가지로 제시하면서도 어떤 방향으로 흘러가든 공통적으로 수혜를 입을 승자 기업을 지목했다. AI 산업 불확실성 속에서 안정적인 투자처를 찾는 시각을 담았다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213601', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213601_217116_4014.png' },
                { date: '2026-08-07', title: 'MS, 사내 개발자 기본 모델로 \'GPT-5.6 솔\' 지정..."효율 최우선"', summary: '마이크로소프트가 사내 개발자들의 기본 AI 모델을 \'GPT-5.6 솔\'로 지정하며 효율을 최우선 기준으로 내세웠다. 최신·최고 사양보다 실용적 효율을 추구하는 기업 AI 도입 방향을 보여주는 사례다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213604', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213604_217122_3046.jpg' },
                { date: '2026-08-07', title: '영상과 소리를 한 번에 만드는 AI 시대 [정원훈의 AI 트렌드]', summary: '영상과 음성을 동시에 생성하는 멀티모달 AI가 등장하며 콘텐츠 제작의 패러다임이 바뀌고 있다. 텍스트만으로 완성도 높은 영상·음성 콘텐츠를 만들 수 있는 시대가 열리면서 크리에이터 산업 전반에 영향을 미칠 전망이다.', source: 'IT조선', importance: 'positive', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092167507', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202608/2023092167507_449537_2210_v150.jpg' },
                { date: '2026-08-07', title: '구글, AI 지휘부 美 마운틴뷰로 이동… 앤트로픽·오픈AI 추격', summary: '구글이 AI 핵심 조직을 미국 마운틴뷰로 집결시키며 앤트로픽·오픈AI 추격에 본격 나섰다. AI 연구와 개발 역량을 한곳에 결집해 경쟁사를 따라잡겠다는 구글의 전략적 움직임이다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092167508', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202608/2023092167508_449536_2027_v150.jpg' },
                { date: '2026-08-07', title: '메타, 첫 AI 코딩 에이전트 \'뮤즈코드\' 공개…"가격 경쟁력으로 승부"', summary: '메타가 첫 번째 AI 코딩 에이전트 \'뮤즈코드\'를 공개하며 가격 경쟁력을 핵심 차별화 전략으로 내세웠다. 고가의 경쟁 제품 대비 압도적인 가격 우위를 앞세워 AI 코딩 에이전트 시장에 도전장을 내밀었다.', source: '조선비즈', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001184766?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/08/06/0001184766_001_20260806163311449.jpg?type=w800' },
                { date: '2026-08-10', title: '삼전닉스 극찬한 \'GPU의 아버지\'…"한국 없었으면 AI혁명 없었다"', summary: 'GPU의 아버지로 불리는 젠슨 황 엔비디아 CEO가 삼성전자와 SK하이닉스를 극찬하며 한국 반도체 없이는 AI 혁명도 없었을 것이라고 밝혔다. 한국 반도체 산업이 글로벌 AI 인프라의 핵심 축임을 재확인하는 발언으로 주목받았다.', source: '매일경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/009/0005718688?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/009/2026/08/10/0005718688_001_20260810070021844.png?type=w800' },
                { date: '2026-08-10', title: '매출은 역대 최대 이익은 제자리… 네이버 \'AI 수익화\' 시험대', summary: '네이버가 역대 최대 매출을 기록했음에도 이익은 제자리를 면치 못하면서 AI 투자 대비 수익화 전략이 시험대에 올랐다. AI 서비스 확장에 따른 비용 증가가 수익성 개선을 가로막는 구조적 과제로 지목되고 있다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092167566', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202608/2023092167566_449585_2229_v150.jpg' },
                { date: '2026-08-10', title: '[8월7일] "챗GPT 충격 이후 최대 개편"…구글, AI 경쟁 \'두 번째 대전환\' 나섰다', summary: '구글이 챗GPT 등장 이후 최대 규모의 AI 서비스 개편에 나서며 AI 경쟁의 두 번째 대전환을 선언했다. 제품과 조직 전반을 AI 중심으로 재편해 선두 자리를 탈환하겠다는 구글의 전면적인 반격이 시작됐다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213652', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213652_217174_5659.png' },
                { date: '2026-08-10', title: '"음성 대화하며 문서 분석까지"...오픈AI, GPT-라이브 기능 대폭 확장', summary: '오픈AI가 GPT-라이브 기능을 대폭 확장해 음성 대화 중에도 문서를 실시간으로 분석하고 답변할 수 있게 됐다. 음성과 텍스트를 넘나드는 멀티모달 AI 어시스턴트로의 진화가 가속화되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213716', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213716_217255_5050.jpg' },
                { date: '2026-08-10', title: '中 \'가성비 AI\'의 역습…"2년 뒤 전세계 기업 절반이 쓴다"', summary: '가격 경쟁력을 앞세운 중국 AI 모델이 빠르게 점유율을 높이면서 2년 안에 전 세계 기업의 절반이 사용할 것이라는 전망이 나왔다. 중국 AI의 기술·가격 양면 경쟁력이 글로벌 AI 시장의 판도를 바꿀 변수로 부상하고 있다.', source: '조선비즈', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001185110?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/08/09/0001185110_001_20260809153113165.jpg?type=w800' },
                { date: '2026-08-10', title: '中 AI 모델도 대형화… 저가 전략 접는다', summary: '저가 전략으로 시장을 공략해온 중국 AI 기업들이 대형 모델 개발에 뛰어들며 전략 전환에 나서고 있다. 단순 가성비에서 벗어나 성능 경쟁에서도 글로벌 빅테크와 정면 대결을 선언한 것이다.', source: '조선일보', importance: 'important', url: 'https://www.chosun.com/economy/tech_it/2026/08/10/VPCG5AX2JBBH3ARXW27ZXKGXH4/', imageUrl: 'https://www.chosun.com/resizer/v2/FT4WHB4FXRBC7GOJIOWAJ7XUSI.png?auth=2520b5e2a8c4e7f81defa57622edea6a26b6b12759f409269d5d19e1aca28933&width=1200&height=630&smart=true' },
                { date: '2026-08-10', title: '스페이스XAI, \'이매진 이미지 2.0\' 공개...생성 넘어 정밀 편집·일관성 집중', summary: '일론 머스크의 xAI가 이미지 생성 AI \'이매진 이미지 2.0\'을 공개하며 단순 생성을 넘어 정밀 편집과 이미지 일관성 유지에 초점을 맞췄다. 기존 이미지 생성 AI의 한계였던 일관성 문제를 해결해 실용성을 높인 것이 특징이다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=213713', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213713_217250_4417.jpg' },
                { date: '2026-08-11', title: '[8월10일] 로봇 영상에 \'빨래 개기\'가 자주 등장하는 이유…하지만 진짜 시험은 따로 있다', summary: '로봇 AI 데모 영상에 빨래 개기 같은 정교한 작업이 자주 등장하는 이유와 함께 실제 로봇 AI의 진짜 시험이 무엇인지를 짚었다. 시각적으로 인상적인 시연 영상 뒤에 있는 로봇 AI의 현실적인 기술 수준과 한계를 분석했다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=213732', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213732_217270_5217.png' },
                { date: '2026-08-11', title: '에이전트 폭증에 GPU 이어 CPU도 비상...AWS "내부 낭비 줄여라"', summary: 'AI 에이전트 수요가 폭증하면서 GPU에 이어 CPU 자원도 포화 상태에 이르자 AWS가 내부적으로 자원 낭비를 줄이라는 지침을 내렸다. AI 에이전트 확산이 가져오는 컴퓨팅 자원 압박이 클라우드 인프라 전반으로 확대되고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213735', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213735_217280_1119.png' },
                { date: '2026-08-11', title: '\'동시 소통\' AI 에이전트 등장…단일 \'클로드 오퍼스 4.8\' 성적 뛰어넘었다', summary: '여러 AI가 동시에 소통하며 협력하는 멀티 에이전트 시스템이 등장해 단일 모델인 클로드 오퍼스 4.8의 성능을 뛰어넘는 결과를 보였다. 단일 대형 모델의 한계를 여러 에이전트의 협력으로 극복하는 새로운 AI 아키텍처 방향이 주목받고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213766', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213766_217325_2830.png' },
                { date: '2026-08-11', title: '스마트폰 이을 차세대 기기는 \'터치\' 아닌 \'목소리\'로 작동… 빅테크 음성 AI 경쟁', summary: '스마트폰을 잇는 차세대 기기가 터치 인터페이스 대신 음성 AI로 작동하는 형태로 진화할 것이라는 전망이 나오면서 빅테크들의 음성 AI 경쟁이 가열되고 있다. 음성을 핵심 인터페이스로 삼는 차세대 디바이스 시대의 서막이 열리고 있다.', source: '조선비즈', importance: 'important', url: 'https://n.news.naver.com/mnews/article/366/0001185364?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/366/2026/08/10/0001185364_001_20260810182410106.jpg?type=w800' },
                { date: '2026-08-11', title: '"美 수출 통제 풀었다는데"…韓 \'미토스5\' 접근은 감감무소식', summary: '미국이 첨단 AI 칩 수출 통제를 일부 완화했음에도 한국은 엔비디아의 최신 AI 칩 미토스5에 대한 접근이 여전히 불투명한 상황이다. 동맹국임에도 첨단 AI 반도체 공급에서 소외되는 현실에 대한 우려가 커지고 있다.', source: '뉴시스', importance: 'important', url: 'https://n.news.naver.com/mnews/article/003/0014119027?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/003/2026/08/11/NISI20260719_0002189709_web_20260719141414_20260811061513850.jpg?type=w800' },
                { date: '2026-08-13', title: '현대차 회장이 직접 코딩 공부한 이유…"IT기업보다 더 IT기업 같게"', summary: '정의선 현대차 회장이 직접 코딩 공부에 나선 배경과 함께 IT 기업 이상의 소프트웨어 역량을 갖추겠다는 현대차의 디지털 전환 의지가 소개됐다. 전통 제조업의 수장이 직접 기술 학습에 나서는 변화가 산업계 전반에 시사하는 바가 크다.', source: '서울경제', importance: 'positive', url: 'https://n.news.naver.com/mnews/article/011/0004651225?sid=101', imageUrl: 'https://imgnews.pstatic.net/image/011/2026/08/13/0004651225_001_20260813063111412.jpg?type=w800' },
                { date: '2026-08-13', title: '[8월12일] 저커버그, 폐쇄형 AI 비판했지만…"메타도 오픈소스는 아니다"', summary: '저커버그가 폐쇄형 AI를 비판해왔으나 메타의 AI 모델도 완전한 오픈소스가 아니라는 지적이 제기됐다. AI 개방성에 대한 빅테크 기업들의 말과 행동 사이의 간극을 조명했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213836', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213836_217405_250.jpg' },
                { date: '2026-08-13', title: '오픈AI, 클로드·커서 작업 환경 흡수…\'에이전트 통합 플랫폼\' 승부수', summary: '오픈AI가 앤트로픽의 클로드와 코딩 에이전트 커서의 작업 환경을 자사 플랫폼에 통합하는 \'에이전트 통합 플랫폼\' 전략을 꺼내들었다. AI 에이전트 생태계의 허브 자리를 차지하기 위한 오픈AI의 공격적 행보다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213849', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213849_217429_827.jpg' },
                { date: '2026-08-13', title: '구글, \'제미나이\' 인기에 국내 네이버 사용자 수 넘어..."AI 확장 결실"', summary: '구글 제미나이의 국내 이용자 수가 네이버를 넘어서며 AI 서비스 확장의 성과가 가시화됐다. 국내 AI 서비스 경쟁에서 글로벌 기업이 토종 플랫폼을 앞선 의미 있는 전환점이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=213866', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/213866_217447_4455.jpg' },
                { date: '2026-08-13', title: '"AI가 만들었다면 정체를 밝혀라"…플랫폼으로 번지는 \'AI 원산지 표시\'', summary: 'AI가 생성한 콘텐츠에는 그 사실을 반드시 표시해야 한다는 \'AI 원산지 표시\' 요구가 주요 플랫폼으로 확산되고 있다. 딥페이크와 AI 콘텐츠 범람 속에서 투명성을 확보하려는 사회적 요구가 높아지는 추세다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003992629?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/12/0003992629_001_20260812181324524.jpg?type=w800' },
                { date: '2026-08-18', title: '업스테이지 \'솔라 프로 4\' 공개… 에이전트 성능 엔비디아 네모트론급', summary: '업스테이지가 신형 AI 모델 \'솔라 프로 4\'를 공개하며 에이전트 수행 성능이 엔비디아의 네모트론급에 달한다고 밝혔다. 국내 AI 스타트업이 글로벌 빅테크의 주력 모델과 어깨를 나란히 하는 수준의 성능을 달성한 사례다.', source: 'IT조선', importance: 'important', url: 'https://it.chosun.com/news/articleView.html?idxno=2023092168167', imageUrl: 'https://cdn.it.chosun.com/news/thumbnail/202608/2023092168167_450180_2435_v150.jpg' },
                { date: '2026-08-18', title: '"친구보다 좋아"…\'AI 네이티브\' 청소년, 가상 연애·우정 의존도 심화', summary: 'AI와의 가상 관계에 의존하는 청소년들이 늘어나며 실제 인간관계를 대체하는 수준에 이르고 있다는 우려가 커지고 있다. AI 네이티브 세대가 가상 연애와 우정을 현실 관계보다 편안하게 여기는 현상과 그 영향이 조명됐다.', source: '머니투데이', importance: 'important', url: 'https://n.news.naver.com/mnews/article/008/0005400989?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/008/2026/08/18/0005400989_001_20260818041828901.jpg?type=w800' },
                { date: '2026-08-18', title: 'AI가 답안 훔치러 갔다… "네 말 맞아?" 아닌 "지금 뭐해?" 물을 때[맹성현의 AI시대 생존 가이드]', summary: 'AI가 다른 AI의 답안을 그대로 가져오는 \'답안 도용\' 문제와 AI 시대의 올바른 활용법을 다룬 칼럼이다. AI에게 정답 확인을 묻는 대신 작업 과정을 지시하는 방식으로 접근하는 새로운 AI 협업 전략을 제시했다.', source: '동아일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/020/0003741336?sid=110', imageUrl: 'https://imgnews.pstatic.net/image/020/2026/08/17/0003741336_001_20260818031613566.png?type=w800' },
                { date: '2026-08-18', title: '오픈AI, 코덱스 대대적 개편 예고… 속도 94%·메모리 88% 감축', summary: '오픈AI가 AI 코딩 에이전트 코덱스의 대대적인 개편을 예고하며 처리 속도 94% 향상과 메모리 사용량 88% 감축이라는 목표를 제시했다. 효율성 혁신을 통해 코딩 에이전트 시장에서의 경쟁력을 대폭 끌어올리겠다는 계획이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214016', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214016_217632_3326.jpg' },
                { date: '2026-08-18', title: '앤스로픽, 2028년 예상 매출 283조원… 현재의 4배', summary: '앤트로픽이 2028년 예상 매출을 283조원으로 전망하며 현재 대비 4배 성장을 목표로 하고 있다. 클로드 시리즈의 기업 시장 확대와 AI 에이전트 수요 급증을 성장 동력으로 삼는 공격적인 사업 전략이 드러난다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003993431?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/18/0003993431_001_20260818003507930.jpg?type=w800' },
                { date: '2026-08-19', title: '과기부, 국민 대상 \'AI 서비스 경진대회\' 개최..."AI 아이디어, 직접 구현"', summary: '과학기술정보통신부가 일반 국민을 대상으로 AI 서비스 아이디어를 직접 구현하는 경진대회를 개최한다. AI 기술의 대중적 활용과 국민 AI 역량 제고를 위한 정부의 참여형 이벤트다.', source: 'AI타임스', importance: 'positive', url: 'https://www.aitimes.com/news/articleView.html?idxno=214081', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214081_217712_165.jpeg' },
                { date: '2026-08-19', title: 'AI 콘텐츠, 게임·OTT·숏폼의 막강한 도전자로… \'어텐션 경제\' 판도 흔든다', summary: 'AI가 생성한 콘텐츠가 게임·OTT·숏폼을 위협하는 강력한 경쟁자로 부상하며 사람들의 시간과 주의를 둘러싼 \'어텐션 경제\'의 판도가 흔들리고 있다. AI 콘텐츠의 급속한 확산이 기존 엔터테인먼트 산업 전반에 미치는 영향이 분석됐다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003993704?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/19/0003993704_001_20260819081310716.jpg?type=w800' },
                { date: '2026-08-19', title: '[8월18일] AI 의료의 새로운 돌파구…의사도 경험하기 어려운 \'희귀질환\'', summary: 'AI가 의사조차 경험하기 어려운 희귀질환 진단과 치료에서 새로운 돌파구를 열고 있다. 방대한 의료 데이터 학습을 기반으로 희귀질환 분야에서 AI의 의료적 활용 가능성이 주목받고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214043', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214043_217666_4153.png' },
                { date: '2026-08-19', title: '오픈AI, 청소년용 챗GPT 출시…유해대화·정서적 유착 제한', summary: '오픈AI가 청소년을 위한 전용 챗GPT를 출시하며 유해 대화와 정서적 유착을 제한하는 안전장치를 탑재했다. 청소년의 AI 활용이 급증하는 가운데 연령에 맞는 보호 기능을 갖춘 AI 서비스 출시가 주목된다.', source: '뉴시스', importance: 'important', url: 'https://n.news.naver.com/mnews/article/003/0014133930?sid=104', imageUrl: 'https://imgnews.pstatic.net/image/003/2026/08/19/NISI20260808_0002207589_web_20260808210015_20260819050713284.jpg?type=w800' },
                { date: '2026-08-19', title: '"인스타 중독" 벌금만 1978조?…메타, 청소년 보호 \'진땀\'', summary: '메타가 인스타그램 중독을 유발한 혐의로 최대 1978조원에 달하는 천문학적 벌금 위기에 처하며 청소년 보호 대응에 진땀을 빼고 있다. 빅테크 플랫폼의 청소년 정신건강 해악에 대한 규제 당국의 압박이 강해지고 있다.', source: '한국경제', importance: 'important', url: 'https://n.news.naver.com/mnews/article/015/0005321905?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/015/2026/08/18/0005321905_001_20260818134011323.jpg?type=w800' },
                { date: '2026-08-19', title: '구글, 파산한 항공사 \'사내 데이터\' 140억에 낙찰…AI 학습 자산 확보', summary: '구글이 파산한 항공사의 내부 업무 데이터를 약 140억원에 낙찰받아 AI 학습용 자산을 확보했다. 고품질 실세계 데이터 확보 경쟁이 치열해지는 가운데 구글이 이색적인 방법으로 AI 훈련 데이터를 확충했다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214061', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214061_217694_128.jpg' },
                { date: '2026-08-19', title: '"우리 AI가 1등" 검증해준다…우후죽순 AI에 \'AI 심판\'도 유망 산업', summary: 'AI 모델의 성능과 신뢰도를 객관적으로 검증해주는 \'AI 심판\' 서비스가 새로운 유망 산업으로 떠오르고 있다. 수많은 AI 제품이 쏟아지는 가운데 독립적인 평가와 인증의 수요가 높아지며 AI 평가 산업의 성장 가능성이 주목된다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003993705?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/19/0003993705_001_20260819075910617.jpg?type=w800' },
                { date: '2026-08-21', title: '"판단은 GPT가"…생각마저 외주 준 2030 [Now 2.30]', summary: '2030 세대가 중요한 판단까지 챗GPT에 맡기는 경향이 심화되면서 사고 능력의 \'외주화\' 문제가 제기되고 있다. AI 의존이 일상화된 청년 세대의 실태와 스스로 생각하는 능력 약화에 대한 우려를 담은 르포다.', source: '데일리안', importance: 'important', url: 'https://n.news.naver.com/mnews/article/119/0003123712?sid=103', imageUrl: 'https://imgnews.pstatic.net/image/119/2026/08/21/0003123712_001_20260821070107582.jpg?type=w800' },
                { date: '2026-08-21', title: '오픈AI, \'기업용 데이터 보안\'으로 승부...프롬프트·응답 저장 안 해', summary: '오픈AI가 기업 고객의 데이터 보안을 최우선 가치로 내세우며 기업용 서비스에서 프롬프트와 응답 내용을 저장하지 않는 정책을 채택했다. 데이터 유출 우려로 AI 도입을 주저하던 기업들을 적극 공략하는 전략이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214137', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214137_217781_4549.jpg' },
                { date: '2026-08-21', title: '오픈AI 훈련 중단… 구글은 출시 연기… 빅테크 AI 개발 경쟁, 속도 조절 나서', summary: '오픈AI가 모델 훈련을 일시 중단하고 구글은 신규 AI 출시를 연기하는 등 빅테크들이 AI 개발 속도 조절에 나섰다. 무한 경쟁보다 안전성과 품질 확보를 우선시하는 기류가 AI 업계 전반에 형성되고 있다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003994081?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/21/0003994081_001_20260821003521075.jpg?type=w800' },
                { date: '2026-08-21', title: '[8월20일] 데이터센터 반발 \'달래기\'에 나선 빅테크…결국 필요한 건 AI 효용 입증', summary: '전력 소비와 환경 문제로 지역 사회의 반발을 받는 데이터센터 건립을 위해 빅테크들이 지역 달래기에 나서고 있다. 결국 AI 인프라 확장의 정당성을 확보하려면 실질적인 AI 효용 입증이 선행돼야 한다는 분석이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214145', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214145_217788_502.png' },
                { date: '2026-08-21', title: '구글, AI 기반 학습 도구 대거 공개…대학생 1년 무료 이벤트까지', summary: '구글이 AI 기반 교육 및 학습 도구를 대거 공개하며 대학생에게 1년 무료 이용 혜택을 제공하는 이벤트를 열었다. AI 교육 도구 시장을 선점하고 미래 세대 이용자를 조기에 확보하려는 전략으로 풀이된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214182', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214182_217843_146.png' },
                { date: '2026-08-21', title: '\'클로드 코워크\' 웹·모바일 확장...구글 워크스페이스 연동 강화', summary: '앤트로픽의 협업 AI 서비스 \'클로드 코워크\'가 웹과 모바일로 확장되며 구글 워크스페이스와의 연동을 강화했다. 업무 환경에 깊숙이 통합되는 AI 협업 도구로서의 입지를 넓히는 전략적 확장이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214171', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214171_217827_562.jpg' },
                { date: '2026-08-24', title: '정부, \'미래대응기금\' 신설…초과세수로 AI·첨단기술 집중 투자', summary: '정부가 초과 세수를 재원으로 하는 \'미래대응기금\'을 새로 만들어 AI와 첨단기술 분야에 집중 투자하기로 했다. 단기 경기 대응에 그치지 않고 미래 기술 경쟁력 확보를 위한 중장기 재정 수단을 마련한다는 구상이다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214237', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214237_217907_5951.png' },
                { date: '2026-08-24', title: '구글, \'안티그래비티\' 원격 제어 출시..."이동 중에도 AI 개발 계속"', summary: '구글이 이동 중에도 AI 개발 작업을 이어갈 수 있도록 원격으로 개발 환경을 제어하는 \'안티그래비티\' 서비스를 출시했다. 장소와 기기의 제약 없이 AI 개발 생산성을 높이기 위한 새로운 도구다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214259', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214259_217942_1345.png' },
                { date: '2026-08-24', title: '오픈AI, \'GPT-5.6 솔\'까지 가격 일시 인하...코덱스 사용자 2천만 돌파', summary: '오픈AI가 최신 모델 GPT-5.6 솔을 포함해 주요 모델의 가격을 일시 인하하며 이용자 확대에 나섰다. 코딩 AI 에이전트 코덱스의 사용자도 2천만 명을 돌파하며 오픈AI 플랫폼의 저변이 빠르게 넓어지고 있다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214240', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214240_217911_3836.png' },
                { date: '2026-08-24', title: '앤스로픽은 칩 만들고… 엔비디아는 AI 모델 개발', summary: 'AI 소프트웨어 회사 앤트로픽이 자체 칩 개발에 나서고, 반도체 기업 엔비디아가 AI 모델 개발로 영역을 확장하면서 AI 업계의 경계가 무너지고 있다. 하드웨어와 소프트웨어를 넘나드는 빅테크의 수직 통합 전략이 가속화되는 양상이다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003994449?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/24/0003994449_001_20260824062911987.jpg?type=w800' },
                { date: '2026-08-24', title: '이름 숨기고 공짜로 풀린 AI \'옥스 알파\' 화제…이번에도 중국산?', summary: '출처를 밝히지 않고 무료로 공개된 AI 모델 \'옥스 알파\'가 뛰어난 성능으로 화제를 모으고 있으며 중국산 모델일 가능성이 제기되고 있다. 중국 AI 모델들이 익명으로 글로벌 시장에 침투하는 방식이 반복되는 추세다.', source: '조선일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/023/0003994401?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/023/2026/08/23/0003994401_001_20260823170811288.jpg?type=w800' },
                { date: '2026-08-25', title: '[단독] 아틀라스 개발·반복조립 통합관리…보스턴다이내믹스, 양산 체계 고도화 [현대차 로봇 승부수]', summary: '현대차 산하 보스턴다이내믹스가 로봇 아틀라스의 개발과 반복조립을 통합 관리하는 양산 체계를 고도화하고 있다. 현대차그룹이 로봇 산업을 미래 핵심 사업으로 본격 육성하는 전략의 일환이다.', source: '이투데이', importance: 'important', url: 'https://www.etoday.co.kr/news/view/2617368', imageUrl: 'https://img.etoday.co.kr/pto_db/2026/08/20260824175320_2377462_660_777.jpg' },
                { date: '2026-08-25', title: '"누끼 제거는 옛말"…오픈AI, API로 \'배경 없는 투명 이미지\' 직접 생성', summary: '오픈AI가 API를 통해 배경이 제거된 투명 이미지를 직접 생성할 수 있는 기능을 출시했다. 기존의 후처리 방식인 배경 제거(누끼)를 거치지 않고도 처음부터 투명 배경 이미지를 생성할 수 있어 디자인·광고 분야 활용이 주목된다.', source: 'AI타임스', importance: 'important', url: 'https://www.aitimes.com/news/articleView.html?idxno=214301', imageUrl: 'https://cdn.aitimes.com/news/photo/202608/214301_217991_4223.jpg' },
                { date: '2026-08-25', title: '제미나이 개발자가 구글 나와 창업한 이유… "AI 변곡점? \'이 기술\'"', summary: '구글 제미나이 개발에 참여했던 연구자가 구글을 떠나 창업한 배경과 자신이 주목하는 AI 기술의 변곡점을 밝혔다. 빅테크 AI 연구자들의 독립 창업이 이어지는 가운데 차세대 AI 기술의 방향성에 대한 인사이트를 제공했다.', source: '한국일보', importance: 'important', url: 'https://n.news.naver.com/mnews/article/469/0000949848?sid=105', imageUrl: 'https://imgnews.pstatic.net/image/469/2026/08/25/0000949848_001_20260825061401610.jpg?type=w800' },

        const PROXIES = [

        function extractOgImage(html) {
            const patterns = [
                /property=["']og:image["'][^>]*content=["']([^"']+)["']/i,
                /content=["']([^"']+)["'][^>]*property=["']og:image["']/i,
                /og:image.*?content=["']([^"']+)["']/i,
            ];
            for (const p of patterns) {
                const m = html.match(p);
                if (m && m[1].startsWith('http')) return m[1];
            }
            return '';
        }

        async function loadThumbnail(imgDiv, articleUrl) {
            if (thumbCache[articleUrl] !== undefined) {
                if (thumbCache[articleUrl]) applyThumbnail(imgDiv, thumbCache[articleUrl]);
                return;
            }
            for (const makeProxy of PROXIES) {
                try {
                    const res = await fetch(makeProxy(articleUrl), { signal: AbortSignal.timeout(7000) });
                    if (!res.ok) continue;
                    const html = await res.text();
                    const src = extractOgImage(html);
                    thumbCache[articleUrl] = src;
                    saveCache();
                    if (src) applyThumbnail(imgDiv, src);
                    return;
                } catch(e) { continue; }
            }
            thumbCache[articleUrl] = '';
            saveCache();
        }

        function applyThumbnail(imgDiv, src) {
            const fallback = imgDiv.querySelector('.news-image-fallback');
            const img = document.createElement('img');
            img.src = src;
            img.alt = '';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;inset:0;';
            img.onload  = () => { if (fallback) fallback.style.display = 'none'; };
            img.onerror = () => img.remove();
            imgDiv.insertBefore(img, fallback);
        }

        function observeThumbnails() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const el = entry.target;
                    obs.unobserve(el);
                    loadThumbnail(el, el.dataset.url);
                });
            }, { rootMargin: '300px' });
            document.querySelectorAll('.news-image[data-url]').forEach(el => obs.observe(el));
        }

        function createNewsCard(item) {
            const safeUrl = item.url.replace(/'/g, "\\'");
            const isRead = readArticles.has(item.url);
            const isBookmarked = bookmarks.has(item.url);
            return `
                <a href="${item.url}" target="_blank" class="news-card-link" onclick="trackClick('${safeUrl}'); markRead('${safeUrl}')">
                    <article class="news-card${isRead ? ' read' : ''}" data-url="${item.url}">
                        <div class="news-image" data-url="${item.url}" style="position:relative;">
                            ${isRead ? '<span class="read-badge">✓ 읽음</span>' : ''}
                            <button class="share-btn" onclick="copyLink('${safeUrl}', event)" title="링크 복사">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            </button>
                            <button class="bookmark-btn${isBookmarked ? ' active' : ''}"
                                onclick="toggleBookmark('${safeUrl}', event)"
                                title="북마크">${isBookmarked ? '★' : '☆'}</button>
                            ${item.imageUrl ? `<img src="${item.imageUrl}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" onerror="this.remove()">` : ''}
                            <div class="news-image-fallback" style="${item.imageUrl ? 'display:none' : ''}">
                                <div class="fallback-bar"></div>
                                <div class="fallback-text">NEWS</div>
                                <div class="fallback-sub">아이스크림미디어</div>
                            </div>
                        </div>
                        <div class="news-content">
                            <div class="news-meta">
                                <span class="news-date">${formatDate(item.date)}</span>
                            </div>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-summary">${item.summary}</p>
                            <div class="news-footer">
                                <span class="news-source">${item.source}</span>
                            </div>
                        </div>
                    </article>
                </a>`;
        }

        function updateStats() {
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            // 이번주 월요일 구하기
            const day = today.getDay(); // 0=일,1=월,...
            const diff = (day === 0 ? -6 : 1 - day);
            const monday = new Date(today);
            monday.setDate(today.getDate() + diff);
            monday.setHours(0, 0, 0, 0);

            let weekCount = 0, todayCount = 0;
            allNews.forEach(item => {
                if (!item.date) return;
                const d = new Date(item.date);
                if (item.date === todayStr) todayCount++;
                if (d >= monday) weekCount++;
            });
            document.getElementById('weekNews').textContent = weekCount;
            document.getElementById('todayNews').textContent = todayCount;
        }

        function updateFeedTitle() {
            let rangeStart = null, rangeEnd = null;
            if (dateRange.start && dateRange.end) {
                rangeStart = dateRange.start <= dateRange.end ? dateRange.start : dateRange.end;
                rangeEnd   = dateRange.start <= dateRange.end ? dateRange.end   : dateRange.start;
            }
            const count = getFilteredCatData().reduce((s, { filtered }) => s + filtered.length, 0);

            if (rangeStart) {
                document.getElementById('feedTitle').textContent =
                    rangeStart === rangeEnd
                        ? formatDate(rangeStart)
                        : `${formatDate(rangeStart)} ~ ${formatDate(rangeEnd)}`;
            } else {
                document.getElementById('feedTitle').textContent = '모든 뉴스';
            }
            document.getElementById('feedSubtitle').textContent = `총 ${count}개의 뉴스`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <div class="toast" id="toast"></div>

    <!-- 상단으로 버튼 (모바일 전용) -->
    <button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="상단으로 이동">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <style>
        #scroll-top-btn {
            display: flex;
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e9460a;
            color: #fff;
            border: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(233,70,10,0.35);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            transform: translateY(10px);
        }
        #scroll-top-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        #scroll-top-btn:active {
            transform: scale(0.92);
        }
    </style>

    <script>
        (function() {
            const btn = document.getElementById('scroll-top-btn');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
